<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英会話学習アプリ</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="theme-color" content="#7c6ff7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --color-bg:#1a1a1a;
    --color-neutral-900:#1a1a1a;
    --color-neutral-800:#242424;
    --color-neutral-700:#2e2e2e;
    --color-neutral-600:#3a3a3a;
    --color-neutral-500:#666666;
    --color-neutral-400:#888888;
    --color-neutral-300:#aaaaaa;
    --color-neutral-200:#d4d4d4;
    --color-neutral-100:#e8e8e8;
    --color-text:#f0f0f0;
    --color-divider:#2e2e2e;
    --color-accent:#7c6ff7;
    --color-accent-300:#a89ffa;
    --color-accent-500:#7c6ff7;
    --color-accent-600:#6a5cf0;
    --color-accent-700:#453c8f;
    --color-accent-800:#2b2857;
    --color-success:#22c55e;
    --color-warning:#f59e0b;
    --color-error:#ef4444;
    --color-info:#38bdf8;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --color-bg:#f4f4f5;
      --color-neutral-900:#ffffff;
      --color-neutral-800:#ffffff;
      --color-neutral-700:#e3e3e6;
      --color-neutral-600:#cfcfd4;
      --color-neutral-500:#999999;
      --color-neutral-400:#777777;
      --color-neutral-300:#555555;
      --color-neutral-200:#333333;
      --color-neutral-100:#1f1f1f;
      --color-text:#1a1a1a;
      --color-divider:#e3e3e6;
      --color-accent:#635fd2;
      --color-accent-300:#4c48b8;
      --color-accent-500:#635fd2;
      --color-accent-600:#524ec0;
      --color-accent-700:#dedcf7;
      --color-accent-800:#eeedfb;
      --color-success:#16a34a;
      --color-warning:#d97706;
      --color-error:#dc2626;
      --color-info:#0284c7;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--color-bg);color:var(--color-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;height:100%}
  #root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
  a{color:var(--color-accent-300);text-decoration:none}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:0;height:0}

  .card{background:var(--color-neutral-800);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);padding:14px}
  .card-kicker{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:2px}
  .card-title{font-size:16px;font-weight:600}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    font-weight:500;font-size:14px;line-height:1.2;color:var(--color-text);
    background:transparent;border:1px solid var(--color-neutral-600);
    padding:10px 16px;border-radius:var(--radius-md);min-height:40px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .btn-secondary{border-color:var(--color-neutral-600)}
  .btn-ghost{border-color:transparent;color:var(--color-accent-300)}
  .btn-icon{width:36px;height:36px;padding:0}
  .btn-block{width:100%}

  .tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:999px}
  .tag-accent{background:var(--color-accent-800);color:var(--color-accent-300)}
  .tag-neutral{background:var(--color-neutral-700);color:var(--color-neutral-300)}
  .tag-outline{border:1px solid var(--color-accent);color:var(--color-accent-300)}

  .seg{display:inline-flex;border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);overflow:hidden}
  .seg-opt{flex:1;padding:8px 10px;font-size:12px;text-align:center;cursor:pointer;
    background:transparent;color:var(--color-neutral-400);border:none;border-right:1px solid var(--color-neutral-700)}
  .seg-opt:last-child{border-right:none}
  .seg-opt[data-active="true"]{background:var(--color-accent-700);color:var(--color-text)}

  input.field,textarea.field{width:100%;background:var(--color-neutral-800);border:1px solid var(--color-neutral-700);
    border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;color:var(--color-text);font-family:inherit;outline:none}
  input.field:focus,textarea.field:focus{border-color:var(--color-accent)}

  /* onboarding */
  #onboarding{flex:1;display:flex;flex-direction:column;padding:70px 26px 28px;box-sizing:border-box}
  .onb-dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
  .onb-dot{width:6px;height:6px;border-radius:50%;background:var(--color-neutral-700)}
  .onb-dot.active{background:var(--color-accent)}
  .onb-option{justify-content:flex-start;text-align:left;width:100%}

  /* app shell */
  #app{display:none;flex:1;flex-direction:column;min-height:100vh;min-height:100dvh}
  #app.active{display:flex}
  .tab-panel{display:none;flex:1;overflow:auto;padding:20px 20px 100px;box-sizing:border-box;flex-direction:column;gap:16px}
  .tab-panel.active{display:flex}

  #bottom-nav{position:sticky;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;
    padding:8px 6px calc(18px + env(safe-area-inset-bottom));background:var(--color-neutral-900);
    border-top:1px solid var(--color-neutral-800);z-index:30}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;
    color:var(--color-neutral-500);padding:4px 8px}
  .nav-btn.active{color:var(--color-accent)}
  .nav-btn span{font-size:10px}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--color-bg);border-radius:20px 20px 0 0;
    border:1px solid var(--color-neutral-700);z-index:41;max-height:85vh;display:flex;flex-direction:column;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--color-neutral-800);
    border:1px solid var(--color-neutral-700);color:var(--color-text);padding:10px 18px;border-radius:999px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="root">

  <div id="onboarding">
    <div id="onb-step0" class="onb-step" style="flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px">
      <img src="./assets/app-icon.png" alt="アプリアイコン" style="width:72px;height:72px;border-radius:16px;display:block">
      <div style="font-weight:600;font-size:30px;line-height:1.25">英会話学習<br>アプリ</div>
      <div style="font-size:15px;line-height:1.6;color:var(--color-neutral-300);max-width:280px">
        週1回の固定セッションと、隙間時間のシャドーイング・単語復習で続けられる設計。
        <span style="color:var(--color-neutral-400)">Business &amp; Travel English</span>
      </div>
      <button class="btn btn-primary btn-block" id="onb-start" style="margin-top:24px">はじめる</button>
    </div>

    <div id="onb-step1" class="onb-step" style="display:none;flex-direction:column;flex:1">
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:28px">
        <div style="font-size:13px;color:var(--color-accent-300);font-weight:500">STEP 1 / 3</div>
        <div style="font-weight:600;font-size:24px">今のレベルは？</div>
        <div style="font-size:14px;color:var(--color-neutral-400)">目安で大丈夫です。あとから変更できます。</div>
      </div>
      <div id="onb-level-options" style="display:flex;flex-direction:column;gap:10px;flex:1"></div>
      <button class="btn btn-primary btn-block" id="onb-to-step2" style="margin-top:20px">次へ</button>
    </div>

    <div id="onb-step2" class="onb-step" style="display:none;flex-direction:column;flex:1">
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:28px">
        <div style="font-size:13px;color:var(--color-accent-300);font-weight:500">STEP 2 / 3</div>
        <div style="font-weight:600;font-size:24px">何を優先しますか？</div>
        <div style="font-size:14px;color:var(--color-neutral-400)">奇数週=ビジネス英語、偶数週=旅行英語で交互に進みます。</div>
      </div>
      <div id="onb-goal-options" style="display:flex;flex-direction:column;gap:10px;flex:1"></div>
      <button class="btn btn-primary btn-block" id="onb-to-step3" style="margin-top:20px">次へ</button>
    </div>

    <div id="onb-step3" class="onb-step" style="display:none;flex-direction:column;flex:1">
      <div style="flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center">
        <div style="font-size:13px;color:var(--color-accent-300);font-weight:500">STEP 3 / 3</div>
        <div style="font-weight:600;font-size:24px">準備ができました</div>
        <div class="card">
          <div style="font-size:14px;line-height:1.7;color:var(--color-neutral-300)">
            週1回、15〜20分の固定セッションだけは必ず。それ以外は気が向いた時にシャドーイングと単語復習を。無理なく継続できるペースで設計しています。
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="onb-finish" style="margin-top:20px">アプリを始める</button>
    </div>

    <div class="onb-dots" id="onb-dots"></div>
  </div>

  <div id="app">
    <div class="tab-panel active" id="tab-home"></div>
    <div class="tab-panel" id="tab-practice"></div>
    <div class="tab-panel" id="tab-vocab"></div>
    <div class="tab-panel" id="tab-progress"></div>
    <div class="tab-panel" id="tab-profile"></div>

    <div id="bottom-nav">
      <button class="nav-btn active" data-tab="home">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 10l8-7 8 7v9a1 1 0 01-1 1h-4v-6H8v6H4a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>ホーム</span>
      </button>
      <button class="nav-btn" data-tab="practice">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 5h16a1 1 0 011 1v9a1 1 0 01-1 1h-9l-4 3v-3H3a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>会話</span>
      </button>
      <button class="nav-btn" data-tab="vocab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="4" width="13" height="15" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="7" y="1" width="13" height="15" rx="1.5" fill="var(--color-bg)" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>単語</span>
      </button>
      <button class="nav-btn" data-tab="progress">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 18V11M11 18V4M18 18v-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>進捗</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M3 19c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>マイページ</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="./js/shared.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// App shell: onboarding gate, tab router, toast helper.
// Stage 2-5 register themselves via App.registerTab(name, {render, onShow}).
// ─────────────────────────────────────────────────────────────
(function () {
  'use strict';

  var LEVELS = ['TOEIC〜600（基礎から）', 'TOEIC600-750（このアプリの前提）', 'TOEIC750-900（応用強化）', 'TOEIC900+（実践のみ）', '目安がわからない'];
  var GOALS = [
    { v: 'business', label: 'ビジネス英語を伸ばす', sub: '会議・進捗報告・1on1' },
    { v: 'travel', label: '旅行に備える', sub: '9月第3週の海外旅行' },
    { v: 'both', label: '両方（週替わり）', sub: '奇数週=ビジネス、偶数週=旅行' },
  ];
  var onbStep = 0;
  var onbLevel = null;
  var onbGoal = 'both';

  function renderOnbDots() {
    var wrap = document.getElementById('onb-dots');
    wrap.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var d = document.createElement('div');
      d.className = 'onb-dot' + (i === onbStep ? ' active' : '');
      wrap.appendChild(d);
    }
  }
  function showOnbStep(n) {
    onbStep = n;
    document.querySelectorAll('.onb-step').forEach(function (el, i) {
      el.style.display = i === n ? 'flex' : 'none';
    });
    renderOnbDots();
  }
  function renderLevelOptions() {
    var wrap = document.getElementById('onb-level-options');
    wrap.innerHTML = '';
    LEVELS.forEach(function (label) {
      var b = document.createElement('button');
      b.className = 'btn onb-option';
      b.textContent = label;
      b.style.borderColor = onbLevel === label ? 'var(--color-accent)' : 'var(--color-neutral-700)';
      b.style.background = onbLevel === label ? 'var(--color-accent-800)' : 'transparent';
      b.style.color = onbLevel === label ? 'var(--color-text)' : 'var(--color-neutral-300)';
      b.onclick = function () { onbLevel = label; renderLevelOptions(); };
      wrap.appendChild(b);
    });
  }
  function renderGoalOptions() {
    var wrap = document.getElementById('onb-goal-options');
    wrap.innerHTML = '';
    GOALS.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'btn onb-option';
      b.style.borderColor = onbGoal === g.v ? 'var(--color-accent)' : 'var(--color-neutral-700)';
      b.style.background = onbGoal === g.v ? 'var(--color-accent-800)' : 'transparent';
      b.style.color = onbGoal === g.v ? 'var(--color-text)' : 'var(--color-neutral-300)';
      b.innerHTML = '<div style="display:flex;flex-direction:column;gap:2px;text-align:left"><span style="font-size:15px">' + g.label + '</span><span style="font-size:12px;color:var(--color-neutral-400)">' + g.sub + '</span></div>';
      b.onclick = function () { onbGoal = g.v; renderGoalOptions(); };
      wrap.appendChild(b);
    });
  }

  function finishOnboarding() {
    localStorage.setItem('onboarded_v1', '1');
    localStorage.setItem('onb_level', onbLevel || '');
    localStorage.setItem('onb_goal', onbGoal);
    localStorage.setItem('weekly_focus', onbGoal === 'travel' ? 'travel' : 'business');
    showApp();
  }

  function showApp() {
    document.getElementById('onboarding').style.display = 'none';
    document.getElementById('app').classList.add('active');
    App.switchTab(App.state.activeTab || 'home');
  }

  document.getElementById('onb-start').onclick = function () { showOnbStep(1); };
  document.getElementById('onb-to-step2').onclick = function () { showOnbStep(2); };
  document.getElementById('onb-to-step3').onclick = function () { showOnbStep(3); };
  document.getElementById('onb-finish').onclick = finishOnboarding;
  renderLevelOptions();
  renderGoalOptions();
  renderOnbDots();

  // ── App namespace: tab registry + router + toast ──
  var tabs = {};
  var App = {
    state: { activeTab: 'home' },
    registerTab: function (name, handlers) { tabs[name] = handlers; },
    switchTab: function (name) {
      if (!tabs[name]) return;
      App.state.activeTab = name;
      document.querySelectorAll('.tab-panel').forEach(function (el) { el.classList.remove('active'); });
      document.querySelectorAll('.nav-btn').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === name);
      });
      document.getElementById('tab-' + name).classList.add('active');
      if (tabs[name].onShow) tabs[name].onShow();
    },
    toast: function (msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2200);
    },
    Shared: window.Shared,
  };
  window.App = App;

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.onclick = function () { App.switchTab(btn.getAttribute('data-tab')); };
  });

  // Boot: skip onboarding for returning users.
  window.addEventListener('DOMContentLoaded', function () {
    if (localStorage.getItem('onboarded_v1')) {
      showApp();
    }
    // Tabs register themselves on script load (see js/dashboard.js etc.), which may
    // happen after or before this DOMContentLoaded fires — App.switchTab is safe either way
    // since it no-ops until the tab is registered, and showApp() re-invokes it above.
  });
})();
</script>
<script src="./js/dashboard.js"></script>
<script src="./js/practice.js"></script>
<script src="./js/vocab.js"></script>
<script src="./js/profile.js"></script>
</body>
</html>
