<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>単語帳</title>
<style>
:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--bg4:#383838;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#3a3a3a;--accent:#7c6ff7;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f5;--bg2:#fff;--bg3:#efefef;--bg4:#e4e4e4;--text:#111;--text2:#555;--text3:#999;--border:#ddd;--accent:#635fd2;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#2563eb}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:17px;font-weight:700}
.header-actions{display:flex;gap:6px}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.tab{flex:1;padding:10px 0;font-size:13px;font-weight:600;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
/* --- Buttons --- */
.btn{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;justify-content:center;transition:opacity .15s;min-height:44px}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== MODE SELECT ===== */
.mode-screen{padding:16px}
.mode-screen h2{font-size:18px;font-weight:700;margin-bottom:4px}
.mode-screen p{font-size:14px;color:var(--text2);margin-bottom:14px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.mode-card{background:var(--bg2);border:2px solid var(--border);border-radius:14px;padding:16px 10px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;min-height:44px}
.mode-card:active{border-color:var(--accent);background:rgba(124,111,247,.1)}
.mode-card-icon{font-size:26px;margin-bottom:6px}
.mode-card-title{font-size:14px;font-weight:700;margin-bottom:3px}
.mode-card-sub{font-size:12px;color:var(--text2);line-height:1.4}
.sub-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.choice-btn{background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s;min-height:60px}
.choice-btn:active{border-color:var(--accent)}
.choice-icon{font-size:24px;width:32px;text-align:center}
.choice-label{font-size:15px;font-weight:700}
.choice-sub{font-size:13px;color:var(--text2);margin-top:2px}

/* ===== PROGRESS ===== */
.prog-wrap{margin-bottom:10px}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);transition:width .3s}
.prog-txt{font-size:12px;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between}
.stats-row{display:flex;gap:6px;margin-bottom:10px}
.stat-pill{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
.stat-num{font-size:17px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:12px;color:var(--text2);margin-top:1px}

/* ===== CARD ===== */
.card-wrap{margin-bottom:10px}
.card-scene{perspective:1000px;cursor:pointer;user-select:none;margin-bottom:10px}
.card-inner{position:relative;width:100%;min-height:220px;transition:transform .4s;transform-style:preserve-3d}
.card-scene.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card-front{background:var(--bg2);border:1px solid var(--border)}
.card-back{background:linear-gradient(135deg,#635fd2,#7c6ff7);transform:rotateY(180deg);color:#fff}
.card-direction{font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:10px;opacity:.6;text-transform:uppercase}
.card-word{font-size:28px;font-weight:700;margin-bottom:6px;line-height:1.3}
.card-pron{font-size:13px;color:var(--text2);margin-bottom:8px}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px}
.level-badge{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:600;background:rgba(124,111,247,.2);color:var(--accent)}
.card-hint{font-size:13px;color:var(--text3);margin-top:8px}
.card-meaning{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.35}
.card-ex{font-size:14px;color:rgba(255,255,255,.85);font-style:italic;line-height:1.6;margin-bottom:10px}
.card-speak-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;min-height:40px}

/* ===== DETAIL SECTION (outside card flip) ===== */
.detail-toggle-btn{display:block;width:100%;margin-top:0;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;color:var(--text2);cursor:pointer;text-align:center;font-weight:600;min-height:44px}
.detail-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:8px}
.detail-panel-row{font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.6}
.detail-panel-row:last-child{margin-bottom:0}
.detail-panel-label{font-weight:700;color:var(--text2);display:block;font-size:12px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}

/* ===== ANSWER BUTTONS (sticky) ===== */
.ans-sticky{position:sticky;bottom:0;z-index:10;background:var(--bg);padding:10px 0 4px;margin-top:8px}
.ans-row{display:flex;gap:6px}
.ans-btn{flex:1;padding:14px 0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;min-height:52px}
.ans-btn:active{opacity:.75}
.btn-again{background:#7f1d1d;color:#fca5a5}
.btn-hard{background:#78350f;color:#fcd34d}
.btn-good{background:#14532d;color:#86efac}
.btn-easy{background:#1e3a5f;color:#7dd3fc}
.review-meta{font-size:12px;color:var(--text2);text-align:center;padding:4px 0 2px}
.streak-flame{color:#f59e0b}

/* ===== FINISH ===== */
.finish{text-align:center;padding:28px 14px}
.finish-icon{font-size:48px;margin-bottom:8px}
.finish-title{font-size:20px;font-weight:700;margin-bottom:4px}
.finish-rate{font-size:15px;color:var(--text2);margin-bottom:16px}
.finish-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.finish-stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px}
.finish-stat-n{font-size:22px;font-weight:700;color:var(--accent)}
.finish-stat-l{font-size:12px;color:var(--text2);margin-top:2px}
.finish-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.chart-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px}

/* ===== LIST TABLE ===== */
.list-filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.filter-chip{font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-weight:600;transition:all .15s;min-height:32px}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.list-summary{font-size:13px;color:var(--text2);margin:6px 0 8px}
.list-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list-table{width:100%;border-collapse:collapse}
.list-table th{font-size:11px;font-weight:700;color:var(--text2);padding:8px 5px;border-bottom:2px solid var(--border);cursor:pointer;text-align:left;white-space:nowrap;user-select:none;-webkit-user-select:none}
.list-table th.sorted{color:var(--accent)}
.list-table td{font-size:13px;padding:8px 5px;border-bottom:1px solid var(--border);vertical-align:middle}
.list-table td.td-word{font-weight:700;font-size:14px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-table td.td-meaning{color:var(--text2);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-table td.td-level{white-space:normal;min-width:60px}
.list-table tr{cursor:pointer;-webkit-tap-highlight-color:transparent}
.list-table tr:active td,.list-table tr:hover td{background:var(--bg2)}
.wl-badge-sm{font-size:10px;padding:1px 5px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);display:inline-block;margin:1px 1px 0 0}
/* ===== SCRIPT SELECTOR (mode select) ===== */
.script-sel-wrap{margin-top:18px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px}
.script-sel-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.script-sel-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.script-sel-item:last-child{border-bottom:none}
.script-sel-item label{font-size:14px;color:var(--text);flex:1;cursor:pointer;line-height:1.3}
.script-sel-item input[type=checkbox]{width:18px;height:18px;margin-right:10px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.script-sel-btns{display:flex;gap:8px;margin-top:10px}
.word-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.word-item:active{border-color:var(--accent)}
.word-item-header{display:flex;align-items:center;gap:8px}
.word-item-main{flex:1}
.word-item-word{font-size:16px;font-weight:700}
.word-item-meaning{font-size:13px;color:var(--text2);margin-top:2px}
.word-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.due-badge{font-size:12px;padding:3px 8px;border-radius:8px;font-weight:600}
.due-now{background:var(--red);color:#fff}
.due-soon{background:var(--amber);color:#fff}
.due-later{background:var(--bg3);color:var(--text2)}
.status-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;width:60px;margin-top:2px}
.sb-green{background:var(--green)}
.sb-amber{background:var(--amber)}
.sb-red{background:var(--red)}
.sb-gray{background:var(--bg4)}
.word-item-levels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wl-badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--text2);font-weight:600}

/* ===== MISC ===== */
.section-label{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.empty{text-align:center;padding:36px 20px;color:var(--text2);font-size:14px}

/* ===== TOAST (redesigned) ===== */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);border-radius:14px;padding:16px 20px;font-size:15px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s ease;pointer-events:none;width:84%;max-width:360px;text-align:center;box-shadow:0 6px 28px rgba(0,0,0,.35)}
.toast.show{opacity:1}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}

/* ===== WORD DETAIL MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .28s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 2px}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 18px 12px;border-bottom:1px solid var(--border);gap:10px}
.modal-title{font-size:19px;font-weight:700;flex:1;line-height:1.3;word-break:break-word}
.modal-close{background:var(--bg3);border:none;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.modal-body{padding:16px 18px 32px}
.modal-pron{font-size:14px;color:var(--text2);margin-bottom:6px}
.modal-meaning{font-size:20px;font-weight:700;margin-bottom:10px;line-height:1.4}
.modal-example{font-size:14px;color:var(--text2);font-style:italic;line-height:1.65;margin-bottom:14px;padding:10px 12px;background:var(--bg3);border-radius:10px}
.modal-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.modal-badge{font-size:12px;padding:4px 10px;border-radius:10px;background:rgba(124,111,247,.15);color:var(--accent);font-weight:600}
.modal-speak-btn{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:18px;min-height:48px}
.modal-section{margin-bottom:16px}
.modal-section-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.modal-section-body{font-size:14px;color:var(--text);line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <a id="backToDash" href="./dashboard.html" style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);text-decoration:none">
          <i data-lucide="arrow-left" style="width:14px;height:14px"></i> ダッシュボード
        </a>
        <div class="app-title">単語帳</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" id="ghSaveBtn" onclick="saveToGitHub()" style="display:none" title="GitHubに保存">💾</button>
        <button class="btn btn-secondary" onclick="loadVocab()" title="再読み込み">🔄</button>
        <button class="btn btn-secondary" onclick="openAddWordModal()" title="単語を追加" style="font-size:13px;padding:8px 12px">＋ 単語</button>
        <button class="btn btn-secondary" id="backBtn" onclick="backToMode()" style="display:none">← 戻る</button>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabBar">
    <div class="tab active" id="tab-study" onclick="switchTab('study')">学習</div>
    <div class="tab" id="tab-list" onclick="switchTab('list')">一覧</div>
    <div class="tab" id="tab-stats" onclick="switchTab('stats')">統計</div>
  </div>
  <div class="content" id="content">
    <div class="empty"><span class="spinner"></span><div style="margin-top:10px">読み込み中...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Add Word Modal -->
<div class="modal-overlay" id="addWordModal" style="display:none" onclick="closeAddWordModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">＋ 単語を追加</div>
      <button class="modal-close" onclick="closeAddWordModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px">単語・熟語 <span style="color:var(--red)">*</span></div>
          <input id="aw-word" type="text" placeholder="例: align on" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;color:var(--text);outline:none">
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px">意味（日本語）<span style="font-weight:400;color:var(--text3)"> — 空欄の場合はAIが生成</span></div>
          <input id="aw-meaning" type="text" placeholder="例: ～について合意する" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;color:var(--text);outline:none">
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px">例文（英語）<span style="font-weight:400;color:var(--text3)"> — 空欄の場合はAIが生成</span></div>
          <input id="aw-example" type="text" placeholder="例: We need to align on the scope." style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;color:var(--text);outline:none">
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px">スクリプト名/出典 <span style="font-weight:400;color:var(--text3)">（任意）</span></div>
          <input id="aw-source" type="text" placeholder="例: 510k-readiness" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;color:var(--text);outline:none">
        </div>
        <div id="aw-status" style="font-size:13px;color:var(--text2);min-height:18px"></div>
        <button onclick="submitAddWord()" id="aw-submit" class="btn btn-primary" style="width:100%;font-size:15px">追加する</button>
      </div>
    </div>
  </div>
</div>

<!-- Word detail modal -->
<div class="modal-overlay" id="wordModal" style="display:none" onclick="closeWordDetail()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeWordDetail()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
var GH_OWNER = 'famio-eng';
var GH_REPO  = 'English-Learning';
var _vp = new URLSearchParams(window.location.search);
var GH_TOKEN = _vp.get('gh') || '';
var GEM_KEY  = _vp.get('k')  || '';
var RAW_BASE = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/main/';
var PROGRESS_KEY = 'vocab_progress_v2';
var STATS_KEY    = 'vocab_daily_stats';

// ============================================================
// STATE
// ============================================================
var words = [];
var currentTab = 'study';
var studyMode = '';
var studyDir  = '';
var queue     = [];
var qIdx      = 0;
var flipped   = false;
var sOk = 0, sTotal = 0, sStreak = 0, sMaxStreak = 0;
var phaseMode = 'select';
var activeFilters = [];
var selectedScripts = null; // null = all scripts
var knownScriptIds = null; // 既知のscriptId一覧。新規スクリプトの自動選択判定に使う
var listSort = {col: 'added', dir: 'desc'};
var listScriptFilter = '';
var listStatusFilter = '';
var synth = window.speechSynthesis;

// All defined level categories (determines mode-select display order)
var ALL_LEVELS = ['中学英語','高校英語','大学受験','TOEIC600','TOEIC800','TOEIC900+','ネイティブ日常','ビジネス英語'];
var HARD_LEVELS = ['TOEIC900+','ビジネス英語'];
// 既知スクリプトのフォールバック名。新しいスクリプトはrebuildScriptTitles()でwords[].sourceから自動追加される
var SCRIPT_TITLES = {short:'自己紹介 ショート版', casual:'自己紹介 カジュアル版', formal:'自己紹介 フォーマル版', 'sop-status-report':'SOP対応課題の状況報告', 'pentest-alignment':'ペネトレーションテスト方針の確認', '510k-readiness':'510k申請に向けた準備状況の確認'};

// data/vocab.json の各単語が持つsource(スクリプトの日本語タイトル)から、
// ハードコードを介さず動的にSCRIPT_TITLESを最新化する。これをしないと、
// 新しいスクリプトを追加してもここが更新されず、単語帳の「復習対象スクリプト選択」
// 等に新スクリプトの単語が出てこない不具合になる。
function rebuildScriptTitles() {
  words.forEach(function(w) {
    if (w.scriptId && w.scriptId !== 'custom' && w.source) {

function recordDailyStat(ok, total) {
  if (total === 0) return;
  var stats = getDailyStats();
  var today = new Date().toISOString().split('T')[0];
  if (!stats[today]) stats[today] = {ok:0, total:0};
  stats[today].ok += ok; stats[today].total += total;
  var keys = Object.keys(stats).sort();
  while (keys.length > 30) { delete stats[keys.shift()]; keys = Object.keys(stats).sort(); }
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}

function markDailyTask(taskKey, doneCount) {
  if (!GH_TOKEN) return;
  var today = new Date().toISOString().split('T')[0];
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS_PATH;
  fetch(apiUrl, {headers: {'Authorization': 'Bearer ' + GH_TOKEN}})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d || !d.content) return;
      var raw = atob(d.content.replace(/\n/g,''));
      var obj;
      try { obj = JSON.parse(decodeURIComponent(escape(raw))); } catch(e) { obj = {}; }
      if (!obj.dailyTasks) obj.dailyTasks = {};
      if (!obj.dailyTasks[today]) obj.dailyTasks[today] = {};
      if (obj.dailyTasks[today][taskKey]) return;
      obj.dailyTasks[today][taskKey] = true;
      if (taskKey === 'vocab' && doneCount !== undefined) {
        obj.dailyTasks[today].vocabDoneCount = doneCount;
      }
      var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(obj, null, 2))));
      return fetch(apiUrl, {
        method: 'PUT',
        headers: {'Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},
        body: JSON.stringify({message:'✅ タスク完了: '+taskKey, content:encoded, sha:d.sha})
      });
    })
    .catch(function() {});
}

var GH_PROGRESS_PATH = 'data/progress.json';

var progressLoadAttempted = false; // 保存済み設定の読み込みを試みた後にtrue(成功・失敗問わず)

function loadSharedProgress() {
  if (!GH_TOKEN) return;
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS_PATH;
  fetch(apiUrl, {headers: {'Authorization': 'Bearer ' + GH_TOKEN}})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (d && d.content) {
        try {
          var obj = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g, '')))));
          if (obj.vocabSelectedScripts !== undefined) {
            selectedScripts = obj.vocabSelectedScripts;
            if (currentTab === 'study' && phaseMode === 'select' && words.length > 0) renderModeSelect();
          }
          if (Array.isArray(obj.vocabKnownScriptIds)) {
            knownScriptIds = obj.vocabKnownScriptIds;
          }
          if (obj.vocabSettings) {
            var vs = obj.vocabSettings;
            if (vs.listSort) listSort = vs.listSort;
            if (vs.listScriptFilter !== undefined) listScriptFilter = vs.listScriptFilter;
            if (Array.isArray(vs.activeFilters)) activeFilters = vs.activeFilters;
          }
        } catch(e) {}
      }
      progressLoadAttempted = true;
      reconcileSelectedScripts();
    }).catch(function(){ progressLoadAttempted = true; reconcileSelectedScripts(); });
}

// 新しく追加されたscriptId(単語帳の絞り込みで選ばれたことがないもの)を自動的に選択状態に加える。
// これをしないと、新しいスクリプトの単語がvocabSelectedScriptsの絞り込みから漏れて、
// data/vocab.jsonには存在するのに単語帳アプリ上には出てこない、という不具合になる。
function reconcileSelectedScripts() {
  // progressLoadAttemptedがfalseのうちに実行すると、まだ読み込んでいない
  // 保存済みselectedScripts/knownScriptIdsを空/nullで上書き保存してしまう
  if (!GH_TOKEN || words.length === 0 || !progressLoadAttempted) return;
  var allIds = words.map(function(w){ return w.scriptId || ''; })
    .filter(function(v, i, a){ return v && a.indexOf(v) === i; });
  if (knownScriptIds === null) {
    // 初回はここまでの全scriptIdを「既知」として記録するだけ(新規追加とはみなさない)
    knownScriptIds = allIds.slice();
    saveSelectedScripts();
    return;
  }
  var newIds = allIds.filter(function(id){ return knownScriptIds.indexOf(id) < 0; });
  if (newIds.length === 0) return;
  knownScriptIds = knownScriptIds.concat(newIds);
  if (selectedScripts !== null) {
    selectedScripts = selectedScripts.concat(newIds);
  }
  saveSelectedScripts();
  showToast('新しいスクリプトの単語を追加しました: ' + newIds.join(', '), true);
  if (currentTab === 'study' && phaseMode === 'select') renderModeSelect();
}

  if (!GH_TOKEN) return;
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS_PATH;
  fetch(apiUrl, {headers: {'Authorization': 'Bearer ' + GH_TOKEN}})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      var existing = {};
      if (d && d.content) {
        try { existing = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g, ''))))); } catch(e) {}
      }
      existing.vocabSelectedScripts = selectedScripts;
      if (knownScriptIds !== null) existing.vocabKnownScriptIds = knownScriptIds;
      var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));
      return fetch(apiUrl, {
        method: 'PUT',
        headers: {'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify({
          message: '📊 vocab settings: ' + new Date().toISOString().split('T')[0],
          content: encoded,
          sha: d ? d.sha : undefined
        })
      });
    }).catch(function(){});
}

// ============================================================
// SRS
// ============================================================
function calcNext(word, q) {
  var base = word.interval || 1;
  var isHard = (word.level||[]).some(function(l){ return HARD_LEVELS.indexOf(l) >= 0; });
  var f = isHard ? 0.8 : 1;
  if (q === 0) return 1/24;
  if (q === 1) return Math.max(0.1, base * 0.6 * f);
  if (q === 2) return Math.max(1,   base * 2.2 * f);
  if (q === 3) return Math.max(4,   base * 3.5 * f);
  return 1;
}

function getDue() {
  var today = new Date().toISOString().split('T')[0];
  var pool = selectedScripts !== null
    ? words.filter(function(w){ return selectedScripts.indexOf(w.scriptId||'') >= 0; })
    : words;
  return pool.filter(function(w){ return !w.nextReview || w.nextReview <= today; });
}

function getScriptPool() {
  return selectedScripts !== null
    ? words.filter(function(w){ return selectedScripts.indexOf(w.scriptId||'') >= 0; })
    : words;
}

function applyReview(id, q) {
  var w = words.find(function(x){ return x.id === id; });
  if (!w) return;
  w.interval = calcNext(w, q);
  var d = new Date(); d.setTime(d.getTime() + w.interval * 86400000);
  w.nextReview = d.toISOString().split('T')[0];
  w.reviewCount = (w.reviewCount||0) + 1;
  if (q >= 2) { w.streak = (w.streak||0)+1; sOk++; sStreak++; if (sStreak > sMaxStreak) sMaxStreak = sStreak; }
  else { w.streak = 0; sStreak = 0; w.missCount = (w.missCount||0)+1; w.lastMissed = new Date().toISOString().split('T')[0]; }
  sTotal++;
}

function buildQueue(targetWords, dir) {
  var today = new Date().toISOString().split('T')[0];
  var sorted = targetWords.slice().sort(function(a, b){
    var am = (a.lastMissed === today) ? 0 : 1;
    var bm = (b.lastMissed === today) ? 0 : 1;
    if (am !== bm) return am - bm;
    var ad = a.nextReview || '', bd = b.nextReview || '';
    if (ad !== bd) return ad < bd ? -1 : 1;
    return (b.missCount||0) - (a.missCount||0);
  });
  if (dir === 'random') {
    queue = sorted.map(function(w){ return {word:w, dir: Math.random()<0.5 ? 'en2ja' : 'ja2en'}; });
  } else {
    queue = sorted.map(function(w){ return {word:w, dir:dir}; });
  }
  qIdx = 0; flipped = false; sOk = 0; sTotal = 0; sStreak = 0; sMaxStreak = 0;
}

function getWordsForMode(mode) {
  var pool = getScriptPool();
  if (mode === 'all') return pool;
  if (mode === 'review') return getDue();
  if (mode.indexOf('script-') === 0) {
    var sid = mode.replace('script-','');
    return words.filter(function(w){ return w.scriptId === sid; });
  }
  if (mode.indexOf('level-') === 0) {
    var lv = mode.replace('level-','');
    return pool.filter(function(w){ return (w.level||[]).indexOf(lv) >= 0; });
  }
  return pool;
}

function renderModeSelect() {

    if (cnt === 0) return '';
    var dueCnt = getDue().filter(function(w){ return w.scriptId === sid; }).length;
    var sub = cnt + '件' + (dueCnt > 0 ? '（要復習 ' + dueCnt + '件）' : '');

      + '<div class="mode-card-sub">'+sub+'</div>'
      + '</div>';
  }).join('');

  // Level cards — dynamic: show ALL_LEVELS that have at least 1 word
  var levelCards = ALL_LEVELS.filter(function(lv){
    return words.some(function(w){ return (w.level||[]).indexOf(lv) >= 0; });
  }).map(function(lv){
    var cnt = words.filter(function(w){ return (w.level||[]).indexOf(lv) >= 0; }).length;
    return '<div class="mode-card" onclick="selectMode(\'level-'+lv+'\')">'
      + '<div class="mode-card-icon">🏷</div>'
      + '<div class="mode-card-title">'+lv+'</div>'
      + '<div class="mode-card-sub">'+cnt+'単語</div>'
      + '</div>';
  }).join('');

  // Script selector section
  var allScriptIds = Object.keys(SCRIPT_TITLES).filter(function(sid){
    return words.some(function(w){ return w.scriptId === sid; });
  });
  var scriptSelItems = allScriptIds.map(function(sid) {
    var checked = selectedScripts === null || selectedScripts.indexOf(sid) >= 0;

    return '<div class="script-sel-item">'
      + '<input type="checkbox" id="ssel-'+sid+'" '+(checked?'checked':'')+' onchange="toggleSelectedScript(\''+sid+'\')">'
      + '<label for="ssel-'+sid+'">'+SCRIPT_TITLES[sid]
        +' <span style="font-size:12px;color:var(--text2)">('+cnt+'単語)</span></label>'
      + '</div>';
  }).join('');
  var scriptSelHtml = '<div class="script-sel-wrap">'
    + '<div class="script-sel-title">🎯 復習対象スクリプトを選択</div>'
    + scriptSelItems
    + '<div class="script-sel-btns">'
    + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="setAllScripts(true)">全選択</button>'
    + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="setAllScripts(false)">全解除</button>'
    + '</div></div>';

  document.getElementById('content').innerHTML =
    '<div class="mode-screen">'
    + '<h2>学習モードを選択</h2>'
    + '<p>今日の復習待ち: <strong>'+dueCount+'件</strong></p>'
    + '<div class="section-label">📄 スクリプト別</div>'
    + '<div class="mode-grid">'+scriptCards+'</div>'
    + '<div class="section-label">🏷 難易度別</div>'
    + '<div class="mode-grid">'+levelCards+'</div>'
    + '<div class="section-label">その他</div>'
    + '<div class="mode-grid">'
    + '<div class="mode-card" onclick="selectMode(\'all\')">'
    + '<div class="mode-card-icon">📚</div><div class="mode-card-title">全体</div>'
    + '<div class="mode-card-sub">全'+getScriptPool().length+'件</div></div>'
    + '<div class="mode-card" onclick="selectMode(\'review\')">'
    + '<div class="mode-card-icon">🔥</div><div class="mode-card-title">要復習のみ</div>'
    + '<div class="mode-card-sub">今日の復習キュー '+dueCount+'件</div></div>'
    + '</div>'
    + scriptSelHtml
    + '</div>';
}

function toggleSelectedScript(sid) {
  var allIds = Object.keys(SCRIPT_TITLES).filter(function(s){
    return words.some(function(w){ return w.scriptId === s; });

  selectedScripts = cur.length === allIds.length ? null : cur;
  saveSelectedScripts();

function renderCard() {
  var c = document.getElementById('content');
  if (queue.length === 0 || qIdx >= queue.length) { renderFinish(); return; }
  var item = queue[qIdx];
  var w = item.word;
  var dir = item.dir;
  var total = queue.length;
  var pct = Math.round(qIdx / total * 100);
  var rate = sTotal > 0 ? Math.round(sOk / sTotal * 100) : '-';

  var remaining = total - qIdx;
  var progressHtml =
    '<div class="stats-row">'
    + '<div class="stat-pill"><div class="stat-num">'+(rate==='-'?'-':rate+'%')+'</div><div class="stat-lbl">正解率</div></div>'
    + '<div class="stat-pill"><div class="stat-num"><span class="streak-flame">🔥</span>'+sStreak+'</div><div class="stat-lbl">連続正解</div></div>'
    + '</div>'
    + '<div class="prog-wrap">'
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px">'
    + '<span>'+total+'件中 '+qIdx+'件完了</span><span>残り '+remaining+'件</span>'
    + '</div>'
    + '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    + '</div>';

  // Card (compact back — no detail inside)
  var cardHtml = buildCardHtml(w, dir, flipped);

  // Detail section OUTSIDE the flip card (no overlap with buttons)
  var detailHtml = buildDetailHtml(w);
  var detailSection = '<div id="detailSection" style="'+(flipped?'':'display:none')+'">'
    + (detailHtml ? detailHtml : '')
    + '</div>';

  var metaHtml = '<div class="review-meta">復習'+(w.reviewCount||0)+'回'
    + (w.streak > 1 ? ' · 🔥連続'+w.streak+'回' : '')
    + (w.missCount > 0 ? ' · ❌'+w.missCount+'回' : '')
    + '</div>';

  // Sticky answer buttons — always visible above fold
  var ansHtml = '<div class="ans-sticky" id="ansRow" style="'+(flipped?'':'display:none')+'">'
    + '<div class="ans-row">'
    + '<button class="ans-btn btn-again" onclick="answer(0)">もう一度</button>'
    + '<button class="ans-btn btn-hard" onclick="answer(1)">難しい</button>'
    + '<button class="ans-btn btn-good" onclick="answer(2)">OK</button>'
    + '<button class="ans-btn btn-easy" onclick="answer(3)">完璧</button>'
    + '</div></div>';

  c.innerHTML = progressHtml
    + '<div class="card-wrap">'+cardHtml+detailSection+'</div>'
    + metaHtml + ansHtml;

  if (!flipped && dir === 'en2ja') {
    setTimeout(function(){ speakWord(w.word); }, 300);
  }
}

function buildCardHtml(w, dir, isFlipped) {
  var wesc = (w.word||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  var levelBadges = (w.level||[]).map(function(l){
    return '<span class="level-badge">'+l+'</span>';
  }).join('');
  var frontContent, backContent;
  if (dir === 'en2ja') {
    frontContent =
      '<div class="card-direction">英語 → 意味</div>'
      + '<div class="card-word">'+escHtml(w.word||'')+'</div>'
      + '<div class="card-pron">'+escHtml(w.pron||'')+'</div>'
      + '<div class="card-badges">'+levelBadges+'</div>'
      + '<div class="card-hint">タップして意味を確認</div>';
    backContent =
      '<div class="card-meaning">'+escHtml(w.meaning||'')+'</div>'
      + (w.example ? '<div class="card-ex">"'+escHtml(w.example)+'"</div>' : '')
      + '<button class="card-speak-btn" onclick="event.stopPropagation();speakWord(\''+wesc+'\')">🔊 発音</button>';
  } else {
    frontContent =
      '<div class="card-direction">日本語 → 英語</div>'
      + '<div class="card-word" style="font-size:20px;line-height:1.4">'+escHtml(w.meaning||'')+'</div>'
      + '<div class="card-hint" style="margin-top:10px">📘 '+escHtml(w.source||'')+'</div>'
      + '<div class="card-hint">タップして英語を確認</div>';
    backContent =
      '<div class="card-word" style="color:#fff;font-size:24px">'+escHtml(w.word||'')+'</div>'
      + '<div class="card-pron" style="color:rgba(255,255,255,.75);margin-bottom:8px">'+escHtml(w.pron||'')+'</div>'
      + '<div class="card-badges" style="margin-bottom:8px">'
      + (w.level||[]).map(function(l){ return '<span style="font-size:12px;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;font-weight:600">'+l+'</span>'; }).join('')
      + '</div>'
      + (w.example ? '<div class="card-ex">"'+escHtml(w.example)+'"</div>' : '')
      + '<button class="card-speak-btn" onclick="event.stopPropagation();speakWord(\''+wesc+'\')">🔊 発音</button>';
  }
  return '<div class="card-scene'+(isFlipped?' flipped':'')+'" id="card" onclick="flipCard()">'
    + '<div class="card-inner">'
    + '<div class="card-face card-front">'+frontContent+'</div>'
    + '<div class="card-face card-back">'+backContent+'</div>'
    + '</div></div>';
}

function buildDetailHtml(w) {
  var rows = '';
  if (w.usageTips) rows += '<div class="detail-panel-row"><span class="detail-panel-label">💡 使い方のコツ</span>'+escHtml(w.usageTips)+'</div>';
  if (w.otherMeanings && w.otherMeanings.length > 0) rows += '<div class="detail-panel-row"><span class="detail-panel-label">📖 他の意味</span>'+escHtml(w.otherMeanings.join(' / '))+'</div>';
  if (w.collocations && w.collocations.length > 0) rows += '<div class="detail-panel-row"><span class="detail-panel-label">🔗 よく使う表現</span>'+escHtml(w.collocations.join('　/　'))+'</div>';
  return rows ? '<div class="detail-panel">'+rows+'</div>' : '';
}

function toggleDetail() {
  var el = document.getElementById('cardDetail');
  var btn = document.getElementById('detailToggle');
  if (!el) return;
  var open = el.style.display !== 'none';
  el.style.display = open ? 'none' : '';
  if (btn) btn.textContent = open ? '▼ 詳細を見る' : '▲ 閉じる';
}

function flipCard() {
  flipped = !flipped;
  var item = queue[qIdx];
  if (!item) return;
  var card = document.getElementById('card');
  if (card) card.classList.toggle('flipped', flipped);
  var ans = document.getElementById('ansRow');
  if (ans) ans.style.display = flipped ? '' : 'none';
  var ds = document.getElementById('detailSection');
  if (ds) ds.style.display = flipped ? '' : 'none';
  if (flipped && item.dir === 'ja2en') speakWord(item.word.word);
}

function answer(q) {
  applyReview(queue[qIdx].word.id, q);
  saveProgressSilent();
  if (q === 0) queue.push(queue.splice(qIdx, 1)[0]);
  else qIdx++;
  flipped = false;
  renderCard();
}

function renderFinish() {
  var rate = sTotal > 0 ? Math.round(sOk / sTotal * 100) : 0;
  var masteredCount = words.filter(function(w){ return w.streak >= 3 && w.interval >= 4; }).length;
  var reviewCount = getDue().length;
  recordDailyStat(sOk, sTotal);
  if (GH_TOKEN) saveStatsToGitHub();
  if (GH_TOKEN && studyMode === 'review') markDailyTask('vocab', queue.length);
  document.getElementById('content').innerHTML =
    '<div class="finish">'
    + '<div class="finish-icon">🎉</div>'
    + '<div class="finish-title">セッション完了！</div>'
    + '<div class="finish-rate">正解率: <strong>'+rate+'%</strong> · 最大連続: 🔥'+sMaxStreak+'</div>'
    + '<div class="finish-stats">'
    + '<div class="finish-stat"><div class="finish-stat-n">'+sOk+'/'+sTotal+'</div><div class="finish-stat-l">今回の正解/出題</div></div>'
    + '<div class="finish-stat"><div class="finish-stat-n">'+masteredCount+'</div><div class="finish-stat-l">習得済み単語</div></div>'
    + '<div class="finish-stat"><div class="finish-stat-n" style="color:var(--amber)">'+reviewCount+'</div><div class="finish-stat-l">要復習</div></div>'
    + '<div class="finish-stat"><div class="finish-stat-n" style="color:var(--red)">'+getDue().filter(function(w){return w.missCount>0;}).length+'</div><div class="finish-stat-l">苦手単語</div></div>'
    + '</div>'
    + buildLineChart()
    + '<div class="finish-btns">'
    + '<button class="btn btn-secondary" onclick="phaseMode=\'select\';document.getElementById(\'backBtn\').style.display=\'none\';renderStudyPhase()">← モード選択</button>'
    + '<button class="btn btn-secondary" onclick="startStudy(\''+studyDir+'\')">もう一度</button>'

    + '</div>';
}

// ============================================================
// LINE CHART (SVG)
// ============================================================
function buildLineChart() {
  var stats = getDailyStats();
  var keys = Object.keys(stats).sort().slice(-7);
  if (keys.length < 1) return '';
  var W=280, H=100, PL=28, PR=10, PT=10, PB=20;
  var iW=W-PL-PR, iH=H-PT-PB;
  var data = keys.map(function(k){ var s=stats[k]; return {date:k, rate:s.total>0?Math.round(s.ok/s.total*100):0}; });
  var n = data.length;
  function px(i){ return PL+(n>1?i*(iW/(n-1)):iW/2); }
  function py(v){ return PT+iH-(v/100*iH); }
  var pathD = data.map(function(d,i){ return (i===0?'M':'L')+px(i).toFixed(1)+','+py(d.rate).toFixed(1); }).join(' ');
  var areaD = pathD+' L'+px(n-1).toFixed(1)+','+(PT+iH)+' L'+PL.toFixed(1)+','+(PT+iH)+' Z';
  var yLbls = [0,50,100].map(function(v){ return '<text x="'+(PL-4)+'" y="'+(py(v)+4)+'" text-anchor="end" font-size="9" fill="var(--text3)">'+v+'</text>'; }).join('');
  var xLbls = data.map(function(d,i){ return '<text x="'+px(i).toFixed(1)+'" y="'+(H-3)+'" text-anchor="middle" font-size="9" fill="var(--text3)">'+d.date.slice(5)+'</text>'; }).join('');
  var dots = data.map(function(d,i){ return '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.rate).toFixed(1)+'" r="3" fill="var(--accent)"/>'; }).join('');
  return '<div class="chart-wrap"><div class="chart-title">📈 過去'+n+'日の正解率</div>'
    + '<svg width="100%" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'
    + '<path d="'+areaD+'" fill="url(#g1)"/>'
    + '<path d="'+pathD+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + yLbls+xLbls+dots+'</svg></div>';
}

// ============================================================
// LIST TAB (table format)
// ============================================================
function renderList() {
  var c = document.getElementById('content');
  if (words.length === 0) { c.innerHTML = '<div class="empty">単語がありません</div>'; return; }
  var today = new Date().toISOString().split('T')[0];

  // Apply filters
  var filtered = words.slice();
  if (activeFilters.length > 0) {
    filtered = filtered.filter(function(w){
      return activeFilters.some(function(f){ return (w.level||[]).indexOf(f) >= 0; });
    });
  }
  if (listScriptFilter) {
    filtered = filtered.filter(function(w){ return w.scriptId === listScriptFilter; });
  }
  if (listStatusFilter === 'mastered') {
    filtered = filtered.filter(function(w){ return w.streak >= 3; });
  } else if (listStatusFilter === 'learning') {
    filtered = filtered.filter(function(w){ return w.streak > 0 && w.streak < 3; });
  } else if (listStatusFilter === 'due') {
    filtered = filtered.filter(function(w){ return !w.nextReview || w.nextReview <= today; });
  }

  // Sort
  var sc = listSort.col, sd = listSort.dir;
  filtered.sort(function(a, b) {
    var av = sc==='word' ? (a.word||'') : sc==='streak' ? (a.streak||0) : sc==='added' ? (a.added||'') : (a.nextReview||'');
    var bv = sc==='word' ? (b.word||'') : sc==='streak' ? (b.streak||0) : sc==='added' ? (b.added||'') : (b.nextReview||'');
    if (av < bv) return sd==='asc' ? -1 : 1;
    if (av > bv) return sd==='asc' ? 1 : -1;
    return 0;
  });

  // Level filter row
  var levelRow = '<div class="list-filter-row">'
    + '<div class="filter-chip'+(activeFilters.length===0?' active':'')+'" onclick="setFilter(null)">全レベル</div>'
    + ALL_LEVELS.filter(function(lv){ return words.some(function(w){ return (w.level||[]).indexOf(lv)>=0; }); })
      .map(function(lv){
        return '<div class="filter-chip'+(activeFilters.indexOf(lv)>=0?' active':'')+'" onclick="toggleFilter(\''+lv+'\')">'+lv+'</div>';
      }).join('')
    + '</div>';

  // Script filter row
  var usedScripts = Object.keys(SCRIPT_TITLES).filter(function(sid){
    return words.some(function(w){ return w.scriptId===sid; });
  });
  var scriptRow = '<div class="list-filter-row">'
    + '<div class="filter-chip'+(listScriptFilter===''?' active':'')+'" onclick="setListScriptFilter(\'\')">📄 全スクリプト</div>'
    + usedScripts.map(function(sid){
        return '<div class="filter-chip'+(listScriptFilter===sid?' active':'')+'" onclick="setListScriptFilter(\''+sid+'\')">'+SCRIPT_TITLES[sid]+'</div>';
      }).join('')
    + '</div>';

  // Status filter row
  var statusRow = '<div class="list-filter-row">'
    + [['','全状態'],['mastered','⭐習得済み'],['learning','📖学習中'],['due','🔥要復習']].map(function(p){
        return '<div class="filter-chip'+(listStatusFilter===p[0]?' active':'')+'" onclick="listStatusFilter=\''+p[0]+'\';renderList()">'+p[1]+'</div>';
      }).join('')
    + '</div>';

  var summaryHtml = '<div class="list-summary">'+filtered.length+' / '+words.length+'単語 · 要復習'
    + filtered.filter(function(w){ return !w.nextReview||w.nextReview<=today; }).length+'件</div>';

  // Sort header helper
  function th(col, label) {
    var active = listSort.col === col;
    var arrow = active ? (listSort.dir==='asc'?' ▲':' ▼') : ' ▲';
    return '<th'+(active?' class="sorted"':'')+' onclick="toggleListSort(\''+col+'\')">'
      +label+'<span style="opacity:'+(active?1:.2)+'">'+arrow+'</span></th>';
  }

  // Table rows
  var rows = filtered.map(function(w) {
    var due = w.nextReview || today;
    var daysLeft = Math.round((new Date(due)-new Date(today))/86400000);
    var dueLabel = daysLeft<=0 ? '今すぐ' : daysLeft===1 ? '明日' : daysLeft+'日後';
    var dueColor = daysLeft<=0 ? 'var(--red)' : daysLeft<=3 ? 'var(--amber)' : 'var(--text2)';
    var status = !w.nextReview || w.nextReview<=today ? '🔥要復習'
               : w.streak>=3 ? '⭐習得済み'
               : w.streak>0  ? '📖学習中'
               : '🆕未学習';
    var lvBadges = (w.level||[]).slice(0,2).map(function(l){
      return '<span class="wl-badge-sm">'+escHtml(l)+'</span>';
    }).join('');
    return '<tr onclick="showWordDetail(\''+w.id+'\')">'
      + '<td class="td-word">'+escHtml(w.word||'')+'</td>'
      + '<td class="td-meaning">'+escHtml(w.meaning||'')+'</td>'
      + '<td class="td-level">'+lvBadges+'</td>'
      + '<td style="white-space:nowrap;font-size:12px;color:var(--text2)">'+escHtml(w.added||'')+'</td>'
      + '<td style="white-space:nowrap;color:'+dueColor+'">'+dueLabel+'</td>'
      + '<td style="white-space:nowrap;font-size:12px">'+status+'</td>'
      + '</tr>';
  }).join('');

  c.innerHTML = levelRow + scriptRow + statusRow + summaryHtml
    + '<div class="list-table-wrap"><table class="list-table">'
    + '<thead><tr>'
    + th('word','単語')+'<th>意味</th><th>難易度</th>'
    + th('added','登録日')
    + th('nextReview','次回復習')
    + th('streak','状態')
    + '</tr></thead>'
    + '<tbody>'+rows+'</tbody>'
    + '</table></div>';
}

function toggleListSort(col) {
  if (listSort.col === col) listSort.dir = listSort.dir==='asc' ? 'desc' : 'asc';
  else { listSort.col = col; listSort.dir = 'asc'; }
  saveVocabSettingsDebounced();
  renderList();
}

function setFilter(lv) { activeFilters = lv ? [lv] : []; saveVocabSettingsDebounced(); renderList(); }
function toggleFilter(lv) {
  var idx = activeFilters.indexOf(lv);
  if (idx >= 0) activeFilters.splice(idx, 1); else activeFilters.push(lv);
  saveVocabSettingsDebounced();
  renderList();
}

function renderStats() {
  var c = document.getElementById('content');
  var total = words.length;
  if (total === 0) { c.innerHTML = '<div class="empty">単語がありません</div>'; return; }
  var mastered = words.filter(function(w){ return w.streak>=3 && w.interval>=4; }).length;
  var learning = words.filter(function(w){ return w.reviewCount>0 && !(w.streak>=3 && w.interval>=4); }).length;
  var review = getDue().length;
  var missWords = words.filter(function(w){ return w.missCount>0; })
    .sort(function(a,b){ return (b.missCount||0)-(a.missCount||0); }).slice(0,5);

  var missHtml = missWords.length > 0
    ? '<div class="section-label">❌ 苦手単語 Top5</div>'

          return '<div class="word-item" onclick="showWordDetail(\''+w.id+'\')">'

            + '<div class="word-item-word">'+escHtml(w.word)+'</div>'
            + '<div class="word-item-meaning">'+escHtml(w.meaning)+'</div>'
            + '</div>'
            + '<div class="word-item-right"><span class="due-badge due-now">❌'+w.missCount+'回</span></div>'
            + '</div></div>';
        }).join('')
    : '';

  c.innerHTML =
    '<div class="stats-row">'
    + '<div class="stat-pill"><div class="stat-num" style="color:var(--green)">'+mastered+'</div><div class="stat-lbl">習得済み</div></div>'
    + '<div class="stat-pill"><div class="stat-num" style="color:var(--amber)">'+learning+'</div><div class="stat-lbl">学習中</div></div>'
    + '<div class="stat-pill"><div class="stat-num" style="color:var(--red)">'+review+'</div><div class="stat-lbl">要復習</div></div>'
    + '</div>'
    + '<div class="prog-wrap">'
    + '<div class="prog-txt"><span>習得状況</span><span>'+Math.round(mastered/total*100)+'%</span></div>'
    + '<div class="prog-bar" style="height:8px;border-radius:4px">'
    + '<div style="height:100%;background:linear-gradient(to right,var(--green) '+Math.round(mastered/total*100)+'%,var(--amber) '+Math.round(mastered/total*100)+'% '+Math.round((mastered+learning)/total*100)+'%,var(--bg3) '+Math.round((mastered+learning)/total*100)+'%);border-radius:4px"></div>'
    + '</div></div>'
    + buildLineChart()
    + missHtml;
}

async function callGeminiWithFallback(payload) {
  var models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
  var base = 'https://generativelanguage.googleapis.com/v1beta/models/';
  function wait(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
  for (var i = 0; i < models.length; i++) {
    var url = base + models[i] + ':generateContent?key=' + GEM_KEY;
    try {
      var r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      var d = await r.json();
      var shouldFallback = false;
      if (r.status === 429 || r.status === 503) shouldFallback = true;
      if (r.status === 404) shouldFallback = true;
      if (d.error) {
        var code = d.error.code;
        var msg = (d.error.message || '').toLowerCase();
        if (code === 429 || code === 503 || code === 404 ||
            msg.indexOf('quota') >= 0 || msg.indexOf('resource_exhausted') >= 0 ||
            msg.indexOf('unavailable') >= 0 || msg.indexOf('overloaded') >= 0 ||
            msg.indexOf('not found') >= 0 || msg.indexOf('not supported') >= 0 ||
            msg.indexOf('deprecated') >= 0) shouldFallback = true;
      }
      if (shouldFallback) { console.log('[Gemini] '+models[i]+' unavailable, waiting 2s...'); await wait(2000); continue; }
      console.log('[Gemini] success: '+models[i]);
      return {data: d, model: models[i], status: r.status};
    } catch(e) { console.log('[Gemini] '+models[i]+' error: '+e.message); await wait(2000); continue; }
  }
  throw new Error('Gemini API利用不可');
}

async function submitAddWord() {
  var wordVal = (document.getElementById('aw-word').value || '').trim();
  if (!wordVal) { document.getElementById('aw-status').textContent = '単語を入力してください'; return; }
  var meaningVal = (document.getElementById('aw-meaning').value || '').trim();
  var exampleVal = (document.getElementById('aw-example').value || '').trim();
  var sourceVal  = (document.getElementById('aw-source').value || '').trim();
  var btn = document.getElementById('aw-submit');
  var st  = document.getElementById('aw-status');
  btn.disabled = true;

  var pron = '', level = [], usageTips = '', collocations = [];
  var needsAI = !meaningVal || !exampleVal;

  if (needsAI && !GEM_KEY) {
    btn.disabled = false;
    st.innerHTML = '<span style="color:var(--red)">⚠️ 意味・例文が未入力で、GeminiキーもURLにありません。手動で入力するか、URLに<code style="background:var(--bg3);padding:1px 4px;border-radius:4px">&k=キー</code>を追加してアクセスし直してください。</span>';
    return;
  }

  if (needsAI) {
    st.textContent = '⏳ AIが情報を生成中...';
    var aiOk = false;
    try {
      var prompt = '以下の英単語/熟語についてビジネス英語学習者向けの情報をJSONのみで返してください。説明文は不要です。\n'
        + '単語: ' + wordVal + '\n\n'
        + '{"pron":"IPA発音記号","meaning":"日本語の意味（簡潔に）","example":"ビジネスシーンでの英語例文","level":["難易度カテゴリ（ビジネス英語/TOEIC800/TOEIC900+/医療等）"],"usageTips":"使い方のコツ（日本語1文）","collocations":["よく使う表現1","よく使う表現2"]}';
      var payload = {contents:[{parts:[{text: prompt}]}], generationConfig:{temperature:0.3, maxOutputTokens:512}};
      var result = await callGeminiWithFallback(payload);
      var txt = ((result.data.candidates||[])[0]||{}).content;
      txt = txt ? ((txt.parts||[])[0]||{}).text || '' : '';
      console.log('[AddWord] Gemini raw:', txt);
      var jsonMatch = txt.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        var parsed = JSON.parse(jsonMatch[0]);
        if (!meaningVal) meaningVal = parsed.meaning || '';
        if (!exampleVal) exampleVal = parsed.example || '';
        pron = parsed.pron || '';
        level = Array.isArray(parsed.level) ? parsed.level : [];
        usageTips = parsed.usageTips || '';
        collocations = Array.isArray(parsed.collocations) ? parsed.collocations : [];
        console.log('[AddWord] parsed:', {meaningVal, exampleVal, pron, level});
        aiOk = !!(meaningVal && exampleVal);
      }
    } catch(e) { console.error('[AddWord] Gemini error:', e); }

    if (!aiOk) {
      btn.disabled = false;
      st.innerHTML = '<span style="color:var(--red)">⚠️ AIによる自動生成に失敗しました。もう一度試すか、意味・例文を手動で入力してください。</span>';
      return;
    }
    st.textContent = '';
  }

  // Build new word object
  var today = new Date().toISOString().split('T')[0];
  var maxId = 0;
  words.forEach(function(w) {
    var n = parseInt((w.id || '').replace(/\D/g,''), 10);
    if (!isNaN(n) && n > maxId) maxId = n;
  });
  var newId = 'w' + String(maxId + 1).padStart(3, '0');
  var newWord = {
    id: newId, word: wordVal, pron: pron, meaning: meaningVal,
    example: exampleVal, source: sourceVal, scriptId: sourceVal || 'custom',
    added: today, level: level, usageTips: usageTips, collocations: collocations,
    otherMeanings: [], interval: 1, nextReview: today,
    reviewCount: 0, streak: 0, missCount: 0, lastMissed: ''
  };

  if (!GH_TOKEN) {
    words.push(newWord);
    st.textContent = '✓ 追加しました（GitHubへの保存にはトークンが必要です）';
    btn.disabled = false; btn.textContent = '追加する';
    closeAddWordModal(); showToast('単語を追加しました', true);
    return;
  }

  st.textContent = '⏳ GitHubに保存中...';
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/data/vocab.json';
  try {
    var ghResp = await fetch(apiUrl, {headers:{'Authorization':'Bearer '+GH_TOKEN}});
    var ghData = await ghResp.json();
    var existing = [];
    if (ghData.content) {
      try { existing = JSON.parse(decodeURIComponent(escape(atob(ghData.content.replace(/\n/g,''))))).words || []; } catch(e) {}
    }
    existing.push(newWord);
    var vocabObj = {words: existing};
    var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(vocabObj, null, 2))));
    var putResp = await fetch(apiUrl, {method:'PUT',
      headers:{'Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify({message:'📚 単語追加: '+wordVal, content:encoded, sha:ghData.sha})
    });
    if (putResp.ok) {
      words.push(newWord);
      closeAddWordModal();
      showToast('「'+wordVal+'」を追加しました', true);
    } else {
      st.textContent = '保存失敗 HTTP ' + putResp.status;
    }
  } catch(e) {
    st.textContent = '保存エラー: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '追加する';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function speakWord(text) {
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  synth.speak(u);
}

function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
