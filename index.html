<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shadowing Practice</title>
<style>
:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#3a3a3a;--accent:#7c6ff7;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#38bdf8;}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f5;--bg2:#fff;--bg3:#efefef;--text:#111;--text2:#555;--text3:#999;--border:#ddd;--accent:#635fd2;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#0284c7;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.app-title{font-size:16px;font-weight:700;color:var(--text)}
.level-wrap{padding:6px 16px 10px}
.level-row{display:flex;justify-content:space-between;margin-bottom:4px}
.level-lbl{font-size:11px;color:var(--text2);font-weight:600}
.level-val{font-size:11px;color:var(--accent);font-weight:700}
.level-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.level-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:2px;transition:width .6s}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;font-size:11px;font-weight:600;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.locked{color:var(--text3);cursor:not-allowed}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.footer{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px 20px}
.controls-wrap{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px 10px}
.speed-row{display:flex;gap:6px;margin-bottom:8px}
.speed-btn{flex:1;padding:7px 0;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.speed-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.prog-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-bottom:5px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:var(--accent);transition:width .3s linear}
.time-row{display:flex;justify-content:space-between;margin-bottom:8px}
.time-txt{font-size:11px;color:var(--text2)}
.play-row{display:flex;gap:8px;margin-bottom:8px}
.btn-play{flex:1;padding:12px;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer;border:none;background:var(--accent);color:#fff}
.btn-stop{padding:12px 15px;font-size:15px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.bot-row{display:flex;align-items:center;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.sdot.playing{background:var(--green)}.sdot.paused{background:var(--amber)}
.stxt{font-size:12px;color:var(--text2);flex:1}
.rep-row{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggle{width:32px;height:18px;border-radius:9px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.knob{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s}
.toggle.on .knob{left:16px}
.btn{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn-rec{background:var(--red);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-rec.recording{background:#7f1d1d}
.sec-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.script-card{padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer}
.script-card.selected{border-color:var(--accent)}
.script-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.script-card-meta{font-size:12px;color:var(--text2);margin-bottom:5px}
.script-card-preview{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.pick-chip{font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-weight:600;min-height:32px;transition:all .15s}
.pick-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sc-badge{font-size:10px;padding:2px 7px;border-radius:8px;margin-left:4px;font-weight:700;vertical-align:middle}
.sc-badge.read{background:#dcfce7;color:#166534}
.sc-badge.shad{background:#dbeafe;color:#1e40af}
.sent-block{margin-bottom:10px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
.sent-en{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:5px}
.sent-ja{font-size:13px;line-height:1.7;color:var(--text2);padding-top:5px;border-top:1px solid var(--border)}
.vocab-item{padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.vocab-word{font-size:14px;font-weight:700;color:var(--accent)}
.vocab-pron{font-size:12px;color:var(--text2);margin:2px 0}
.vocab-meaning{font-size:13px;color:var(--text)}
.vocab-ex{font-size:12px;color:var(--text3);font-style:italic;margin-top:3px}
.script-display{font-size:16px;line-height:2.4;color:var(--text);white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.word{display:inline}
.word.active{background:var(--accent);color:#fff;padding:1px 3px;border-radius:4px}
.word.done{color:var(--text3)}
.slash-marker{color:var(--accent);font-weight:700;font-size:15px;margin:0 1px}
.fb-card{padding:14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);margin-top:10px}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.score-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.advice-list{list-style:none}
.advice-item{font-size:13px;color:var(--text);padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
.advice-item:last-child{border:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.hmode{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;flex-shrink:0}
.hm-r{background:var(--green)}.hm-s{background:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end}
.overlay.open{opacity:1;pointer-events:all}
.sheet{width:100%;background:var(--bg2);border-radius:16px 16px 0 0;padding:20px 16px 32px;transform:translateY(100%);transition:transform .25s}
.overlay.open .sheet{transform:translateY(0)}
.sheet-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);outline:none;font-family:inherit}
.sum-box{display:flex;flex-wrap:wrap;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--text2)}
.sum-box b{color:var(--text)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border-radius:20px;padding:8px 16px;font-size:13px;white-space:nowrap;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.ok{border:1px solid var(--green);color:var(--green)}
.toast.err{border:1px solid var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="topbar">
      <div class="app-title">🎙 Shadowing</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="openRecord()">📝 記録</button>
        <button class="btn btn-secondary btn-sm" onclick="switchTab('pick')">📂 変更</button>
      </div>
    </div>
    <div class="level-wrap">
      <div class="level-row">
        <span class="level-lbl" id="lvlLbl">Level 1</span>
        <span class="level-val" id="lvlVal">0 / 100 pts</span>
      </div>
      <div class="level-bar"><div class="level-fill" id="lvlFill" style="width:0%"></div></div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-pick" onclick="switchTab('pick')">選択</div>
      <div class="tab locked" id="tab-meaning" onclick="switchTab('meaning')">①意味</div>
      <div class="tab locked" id="tab-reading" onclick="switchTab('reading')">②音読</div>
      <div class="tab locked" id="tab-shadowing" onclick="switchTab('shadowing')">③シャドーイング</div>
      <div class="tab" id="tab-progress" onclick="switchTab('progress')">記録</div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer" style="display:none"></div>
  <div class="controls-wrap" id="ctrlWrap" style="display:none">
    <div class="speed-row">
      <button class="speed-btn" data-r="0.5" onclick="setRate(0.5)">×0.5</button>
      <button class="speed-btn active" data-r="0.7" onclick="setRate(0.7)">×0.7</button>
      <button class="speed-btn" data-r="1.0" onclick="setRate(1.0)">×1.0</button>
      <button class="speed-btn" data-r="1.2" onclick="setRate(1.2)">×1.2</button>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="pFill"></div></div>
    <div class="time-row">
      <span class="time-txt" id="tCur">0:00</span>
      <span class="time-txt" id="tTot">0:00</span>
    </div>
    <div class="play-row">
      <button class="btn-play" id="playBtn" onclick="togglePlay()">▶ 再生</button>
      <button class="btn-stop" onclick="stopAll()">⏹</button>
    </div>
    <div class="bot-row">
      <div class="sdot" id="dot"></div>
      <span class="stxt" id="stxt">待機中</span>
      <div class="rep-row" onclick="toggleRepeat()">
        <span style="font-size:12px;color:var(--text2)">🔁</span>
        <div class="toggle" id="toggle"><div class="knob"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="recOverlay" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="sheet-title">📝 GitHubに学習記録を保存</div>
    <div class="field">
      <label>気づき・改善点（任意）</label>
      <input id="recMemo" placeholder="例: regulatory の発音を意識する">
    </div>
    <div class="sum-box" id="recSum"></div>
    <button class="btn btn-primary" id="recSaveBtn" onclick="saveRecord()">GitHubに保存する</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeRecord()">キャンセル</button>
  </div>
</div>
<div class="toast" id="toast"></div>

    raw: "Good morning, everyone. My name is Fami, and I'm the project manager for our electrosurgical generator development initiative.\n\nI'd like to give you a brief background on my journey here. I've been with the medical device company for approximately ten years. However, I want to be transparent: my direct experience in product development is more limited. For most of my tenure, I worked in other functions within the organization. This current project represents my first substantive leadership role in a full-scale medical device development program.\n\nWhat we're developing is an electrosurgical generator\u2014a device that controls the power output of an electric surgical knife, or electroscalpel, used in endoscopic procedures. These are minimally invasive surgeries, which is why precision in power delivery is critical. The regulatory landscape for such devices is demanding, which has been an important learning curve for me.\n\nThe project itself is now in its second year. We've made significant progress through the development and clinical validation phases. As of now, we're preparing to move into regulatory submissions across multiple countries\u2014a major milestone. This involves coordinating with various regulatory bodies, ensuring compliance with their specific requirements, and managing a complex timeline.\n\nTo strengthen my capabilities as a project manager, I completed my PMP certification earlier this year. That credential has given me a more rigorous framework for managing scope, schedule, cost, and stakeholder communication\u2014all critical elements as we navigate the regulatory phase ahead.\n\nI'm committed to bringing both technical diligence and collaborative leadership to this team. I recognize that I'm still building my expertise in the medical device domain, but I'm also bringing a growth mindset and a willingness to learn from all of you. I look forward to working together.",

var GH_PROGRESS_PATH = 'data/progress.json';

function loadScriptProgress() {
  if (!GH_TOKEN) return;
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS_PATH;
  fetch(apiUrl, {headers: {'Authorization': 'Bearer ' + GH_TOKEN}})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d || !d.content) return;
      try {
        var obj = JSON.parse(atob(d.content.replace(/\n/g, '')));
        scriptProgress = obj.scriptProgress || {};
        renderTab('pick');
      } catch(e) {}
    }).catch(function(){});
}

function saveScriptProgress() {
  if (!GH_TOKEN) return;
  var apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS_PATH;
  fetch(apiUrl, {headers: {'Authorization': 'Bearer ' + GH_TOKEN}})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      var existing = {};
      if (d && d.content) {
        try { existing = JSON.parse(atob(d.content.replace(/\n/g, ''))); } catch(e) {}
      }
      existing.scriptProgress = scriptProgress;
      var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));
      return fetch(apiUrl, {
        method: 'PUT',
        headers: {'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify({
          message: '📊 progress: ' + new Date().toISOString().split('T')[0],
          content: encoded,
          sha: d ? d.sha : undefined
        })
      });
    }).catch(function(){});
}

function switchTab(tab) {
  if (['meaning','reading','shadowing'].indexOf(tab) >= 0 && unlocked.indexOf(tab) < 0) {
    showToast('前のステップをクリアしてください', false);
    return;
  }
  stopAll();
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  var el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('active');

  var footer = document.getElementById('footer');
  var ctrl = document.getElementById('ctrlWrap');

  if (tab === 'meaning') {
    footer.style.display = '';
    footer.innerHTML = '<button class="btn btn-primary" onclick="goReading()">理解完了 → ②音読へ</button>';
    ctrl.style.display = 'none';
  } else if (tab === 'reading' || tab === 'shadowing') {
    footer.style.display = '';
    footer.innerHTML = buildRecFooter(tab);
    ctrl.style.display = '';
  } else {
    footer.style.display = 'none';
    footer.innerHTML = '';
    ctrl.style.display = 'none';
  }

  renderTab(tab);
}

function buildRecFooter(tab) {
  var hint = tab === 'shadowing' ? '再生と同時に録音（イヤホン推奨）' : '録音後にAIが評価します';
  return '<div style="padding:10px 12px;background:var(--bg3);border-radius:10px;margin-bottom:8px">'

    + '<div style="display:flex;gap:8px;align-items:center">'
    + '<button class="btn-rec" id="recBtn" onclick="toggleRec(\'' + tab + '\')">● 録音開始</button>'
    + '<span style="font-size:12px;color:var(--text2)" id="recSt">' + hint + '</span>'
    + '</div></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="selfEval(\'bad\',\'' + tab + '\')">😕 難しい</button>'
    + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="selfEval(\'ok\',\'' + tab + '\')">🙂 まあまあ</button>'
    + '<button class="btn btn-primary" style="flex:1;font-size:13px" onclick="selfEval(\'good\',\'' + tab + '\')">😄 できた</button>'
    + '</div>';
}

function unlock(tab) {
  if (unlocked.indexOf(tab) < 0) unlocked.push(tab);
  var el = document.getElementById('tab-' + tab);
  if (el) el.classList.remove('locked');
}

function renderTab(tab) {
  var c = document.getElementById('content');
  if (tab === 'pick') renderPick(c);
  else if (tab === 'meaning') renderMeaning(c);
  else if (tab === 'reading') renderReading(c);
  else if (tab === 'shadowing') renderShadowing(c);
  else if (tab === 'progress') renderProgress(c);
}

// ============================================================
// PICK
// ============================================================
function renderPick(c) {
  var sortedScripts = SCRIPTS.slice().sort(function(a, b) {
    return pickSort === 'asc'
      ? (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
      : (a.date > b.date ? -1 : a.date < b.date ? 1 : 0);
  });
  var filtered = sortedScripts.filter(function(s) {
    if (pickFilter === 'all') return true;
    var sp = scriptProgress[s.id] || {};
    var cleared = sp.readCleared && sp.shadCleared;
    return pickFilter === 'cleared' ? cleared : !cleared;
  });

  var controls = '<div class="pick-controls">'
    + '<span style="font-size:12px;color:var(--text2);font-weight:600">並び替え:</span>'
    + '<div class="pick-chip' + (pickSort === 'asc' ? ' active' : '') + '" onclick="pickSort=\'asc\';renderTab(\'pick\')">↑ 登録日昇順</div>'
    + '<div class="pick-chip' + (pickSort === 'desc' ? ' active' : '') + '" onclick="pickSort=\'desc\';renderTab(\'pick\')">↓ 登録日降順</div>'
    + '<span style="font-size:12px;color:var(--text2);font-weight:600;margin-left:4px">絞込:</span>'
    + ['all', 'uncleared', 'cleared'].map(function(f) {
        var lbl = f === 'all' ? '全て' : f === 'uncleared' ? '未クリア' : 'クリア済';
        return '<div class="pick-chip' + (pickFilter === f ? ' active' : '') + '" onclick="pickFilter=\'' + f + '\';renderTab(\'pick\')">' + lbl + '</div>';
      }).join('')
    + '</div>';

  var cards = filtered.map(function(s) {
    var sel = current && current.id === s.id ? ' selected' : '';
    var sp = scriptProgress[s.id] || {};
    var badges = '';
    if (sp.readCleared) badges += ' <span class="sc-badge read">音読✓</span>';
    if (sp.shadCleared) badges += ' <span class="sc-badge shad">シャドー✓</span>';
    var lastInfo = sp.lastDate
      ? ' · 最終 ' + sp.lastDate + (sp.lastScore !== undefined ? ' (' + sp.lastScore + '点)' : '')
      : '';
    return '<div class="script-card' + sel + '" onclick="selectScript(\'' + s.id + '\')">'
      + '<div class="script-card-title">' + s.title + badges + '</div>'
      + '<div class="script-card-meta">📅 ' + s.date + lastInfo + (s.tip ? ' · 💡 ' + s.tip : '') + '</div>'
      + '<div class="script-card-preview">' + s.raw.substring(0, 80) + '...</div>'
      + '</div>';
  }).join('') || '<div style="text-align:center;padding:24px;color:var(--text2)">該当なし</div>';

  var btn = current ? '<button class="btn btn-primary" style="margin-top:4px" onclick="startPractice()">→ 練習スタート</button>' : '';
  c.innerHTML = '<div style="max-width:600px;margin:0 auto"><div class="sec-title">📂 スクリプトを選択</div>' + controls + cards + btn + '</div>';
}

function selectScript(id) {
  current = null;
  for (var i = 0; i < SCRIPTS.length; i++) {
    if (SCRIPTS[i].id === id) { current = SCRIPTS[i]; break; }
  }
  unlocked = ['pick', 'progress'];
  ['meaning','reading','shadowing'].forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    if (el) el.classList.add('locked');
  });
  readOk = 0; shadOk = 0;
  renderTab('pick');
}

function startPractice() {
  unlock('meaning');
  unlocked = ['pick','progress','meaning'];
  switchTab('meaning');
}

// ============================================================
// MEANING
// ============================================================
function renderMeaning(c) {
  if (!current) return;
  var sents = current.analyzed.sentences.map(function(s) {
    return '<div class="sent-block"><div class="sent-en">' + s.en + '</div><div class="sent-ja">' + s.ja + '</div></div>';
  }).join('');
  var voc = current.vocab.map(function(v) {
    var wesc = v.word.replace(/'/g, "\\'");
    return '<div class="vocab-item">'
      + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">'
      + '<div style="flex:1">'
      + '<div class="vocab-word">' + v.word + '</div>'
      + '<div class="vocab-pron">' + (v.pron || '') + '</div>'
      + '<div class="vocab-meaning">' + v.meaning + '</div>'
      + (v.example ? '<div class="vocab-ex">"' + v.example + '"</div>' : '')
      + '</div>'
      + '<button onclick="speakText(\'' + wesc + '\')" style="flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px">🔊</button>'
      + '</div></div>';
  }).join('');
  var tips = current.analyzed.pronunciationTips.map(function(t) {
    return '<div style="font-size:13px;color:var(--text);padding:6px 0;border-bottom:1px solid var(--border)">🎯 ' + t + '</div>';
  }).join('');
  c.innerHTML = '<div style="max-width:600px;margin:0 auto">'
    + '<div class="sec-title">📖 文ごとの日本語訳</div>' + sents
    + '<div class="sec-title" style="margin-top:16px">📚 重要単語・イディオム</div>' + voc
    + '<div style="margin-top:16px;padding:14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);margin-bottom:8px">'
    + '<div class="sec-title" style="margin-bottom:8px">🗣 発音ポイント</div>' + tips
    + '</div></div>';
}

function goReading() { unlock('reading'); switchTab('reading'); }

// ============================================================
// DISPLAY BUILDER
// ============================================================
function buildDisplay() {
  if (!current) return '';
  var groups = current.breathGroups || [];
  var wordGroupMap = [];
  groups.forEach(function(g, gi) {
    g.split(/\s+/).filter(function(w) { return w.length > 0; }).forEach(function() {
      wordGroupMap.push(gi);
    });
  });
  var tokens = current.raw.trim().split(/(\s+)/);
  var wordIdx = 0;
  var prevGroup = -1;
  var out = '<div class="script-display" style="line-height:2.4">';
  tokens.forEach(function(token) {
    if (/\S/.test(token)) {
      var gi = wordGroupMap[wordIdx] !== undefined ? wordGroupMap[wordIdx] : wordGroupMap[wordGroupMap.length - 1];
      if (showBreath && gi !== prevGroup && prevGroup !== -1) {
        out += '<span class="slash-marker"> /</span> ';
      }
      out += '<span class="word" id="w' + wordIdx + '">' + token + '</span>';
      prevGroup = gi;
      wordIdx++;
    } else if (!/\n/.test(token)) {
      out += ' ';
    } else {
      out += '<br><br>';
    }
  });
  return out + '</div>';
}

// ============================================================
// READING / SHADOWING
// ============================================================
function renderReading(c) {
  c.innerHTML = '<div style="max-width:600px;margin:0 auto">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<div style="font-size:12px;color:var(--text2)">💡 意味を確認しながら音読しましょう</div>'
    + '<div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleBreath()">'
    + '<span style="font-size:12px;color:var(--text2)">息継ぎ</span>'
    + '<div class="toggle ' + (showBreath ? 'on' : '') + '" id="breathToggle"><div class="knob"></div></div>'
    + '</div></div>'
    + '<div id="sd">' + buildDisplay() + '</div>'
    + '<div id="fbArea"></div></div>';
}

function renderShadowing(c) {
  c.innerHTML = '<div style="max-width:600px;margin:0 auto">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<div style="font-size:12px;color:var(--text2)">🎧 音声に重ねて声を出してください</div>'
    + '<div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleBreath()">'
    + '<span style="font-size:12px;color:var(--text2)">息継ぎ</span>'

    + '</div></div>'
    + '<div id="sd">' + buildDisplay() + '</div>'
    + '<div id="fbArea"></div></div>';
}

function toggleBreath() {
  showBreath = !showBreath;
  stopAll();
  var tog = document.getElementById('breathToggle');
  if (tog) tog.classList.toggle('on', showBreath);
  var sd = document.getElementById('sd');
  if (sd) sd.innerHTML = buildDisplay();
}

// ============================================================
// RECORDING
// ============================================================
function toggleRec(mode) {
  if (isRec) stopRec();
  else startRec(mode);
}

function startRec(mode) {
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream) {
    recChunks = [];
    var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    recMimeType = '';
    for (var i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported(types[i])) {
        recMimeType = types[i];
        break;
      }
    }
    var options = recMimeType ? {mimeType: recMimeType} : {};
    mediaRec = new MediaRecorder(stream, options);
    mediaRec.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) recChunks.push(e.data);
    };
    mediaRec.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      setTimeout(function() { onRecReady(mode); }, 300);
    };
    mediaRec.start(100);
    isRec = true;
    var btn = document.getElementById('recBtn');
    var st = document.getElementById('recSt');
    if (btn) { btn.textContent = '⏹ 録音停止'; btn.classList.add('recording'); }
    if (st) st.textContent = '録音中...';
    if (mode === 'shadowing' && !playing) doSpeak();
  }).catch(function(e) {
    showToast('マイクへのアクセスを許可してください', false);
  });
}

function stopRec() {
  if (mediaRec && isRec) {
    try { if (mediaRec.state === 'recording') mediaRec.requestData(); } catch(e) {}
    mediaRec.stop();
    isRec = false;
    var btn = document.getElementById('recBtn');
    if (btn) { btn.textContent = '● 録音開始'; btn.classList.remove('recording'); }
    var st = document.getElementById('recSt');
    if (st) st.textContent = '処理中...';
  }
}

function onRecReady(mode) {
  var totalSize = recChunks.reduce(function(s, c) { return s + c.size; }, 0);
  var st = document.getElementById('recSt');
  if (st) st.textContent = '録音完了';
  var fa = document.getElementById('fbArea');
  if (!fa) return;
  var sizeStr = (totalSize / 1024).toFixed(1) + 'KB';
  var modeEsc = mode;

  if (totalSize > 0) {
    var mtype = recMimeType || 'audio/webm';
    var blob = new Blob(recChunks, {type: mtype});
    var reader = new FileReader();
    reader.onload = function() {
      var dataUrl = reader.result;
      lastRecDataUrl = dataUrl; // save for later replay
      var html = '<div class="fb-card" style="margin-top:10px">';
      html += '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">録音完了（' + sizeStr + '）</div>';
      html += '<div style="margin-bottom:10px">';
      html += '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">🎧 録音を確認する</div>';
      html += '<audio controls style="width:100%;height:40px" src="' + dataUrl + '"></audio>';
      html += '</div>';
      html += '<div style="display:flex;gap:8px">';
      html += '<button class="btn btn-secondary" style="flex:1" onclick="retryRec(\'' + modeEsc + '\')">🔄 録り直す</button>';
      html += '<button class="btn btn-primary" style="flex:1" onclick="evalRec(\'' + modeEsc + '\')">✨ AI評価する</button>';
      html += '</div></div>';
      fa.innerHTML = html;
    };
    reader.readAsDataURL(blob);
  } else {
    var html = '<div class="fb-card" style="margin-top:10px">';
    html += '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">録音完了（' + sizeStr + '）</div>';
    html += '<div style="display:flex;gap:8px">';
    html += '<button class="btn btn-secondary" style="flex:1" onclick="retryRec(\'' + modeEsc + '\')">🔄 録り直す</button>';
    html += '<button class="btn btn-primary" style="flex:1" disabled>✨ AI評価する</button>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--red);margin-top:8px">⚠️ 録音データが空です。</div>';
    html += '</div>';
    fa.innerHTML = html;
  }
}

function retryRec(mode) {
  recChunks = [];
  lastSavedRecUrl = '';
  var fa = document.getElementById('fbArea');
  if (fa) fa.innerHTML = '';
  var st = document.getElementById('recSt');
  if (st) st.textContent = mode === 'shadowing' ? '再生と同時に録音' : '録音後にAIが評価します';
}

// ============================================================
// RECORDING AUTO-SAVE TO GITHUB
// ============================================================
function autoSaveRecording(mode) {
  if (!GH_TOKEN) return;
  var totalSize = recChunks.reduce(function(s, c) { return s + c.size; }, 0);
  if (totalSize === 0) return;
  var mtype = recMimeType || 'audio/webm';
  var blob = new Blob(recChunks, {type: mtype});
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  var ext = mtype.includes('mp4') ? 'm4a' : mtype.includes('ogg') ? 'ogg' : 'webm';
  var scriptId = (current && current.id) ? current.id : 'unknown';
  // 形式: YYYY-MM-DD-HH-MM-{scriptId}-{mode}.ext
  var fname = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
    + '-' + pad(now.getHours()) + '-' + pad(now.getMinutes())
    + '-' + scriptId + '-' + mode + '.' + ext;
  var reader = new FileReader();
  reader.onload = function() {
    var b64 = reader.result.split(',')[1];
    fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/recordings/' + fname, {
      method: 'PUT',
      headers: {'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify({message: '🎤 録音: ' + fname, content: b64})
    }).then(function(r) {
      if (r.ok) {
        lastSavedRecUrl = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/main/recordings/' + fname;
        showToast('🎙 録音を保存しました', true);
      }
    }).catch(function() {}); // サイレント失敗（評価に影響させない）
  };
  reader.readAsDataURL(blob);
}

function evalRec(mode) {
  autoSaveRecording(mode); // バックグラウンドで録音をGitHubに保存
  var fa = document.getElementById('fbArea');
  if (fa) fa.innerHTML = '<div style="text-align:center;padding:16px"><span class="spinner"></span><div style="font-size:13px;color:var(--text2);margin-top:8px">Gemini AI評価中...</div></div>';

  var totalSize = recChunks.reduce(function(s, c) { return s + c.size; }, 0);
  if (totalSize === 0) {
    if (fa) fa.innerHTML = '<div style="font-size:13px;color:var(--red);padding:10px">録音データが空です。もう一度録音してください。</div>';
    return;
  }

  var mtype = recMimeType || 'audio/webm';
  var blob = new Blob(recChunks, {type: mtype});
  var reader = new FileReader();
  reader.onload = function() {
    var b64 = reader.result.split(',')[1];
    var scriptText = current ? current.raw.substring(0, 300) : '';
    var payload = {
      contents: [{
        parts: [
          {
            text: 'You are an English pronunciation coach for a Japanese business professional.\nEvaluate this audio recording. Mode: ' + mode + '.\nTarget script: "' + scriptText.substring(0,150) + '"\n\nScore based on:\n- Pronunciation accuracy (especially difficult words: electrosurgical, regulatory, endoscopic)\n- Natural rhythm and stress\n- Fluency and pacing\n- Clarity\n\nReturn ONLY valid JSON, no markdown:\n{"score":0,"passed":false,"scoreLabel":"Good","strengths":["具体的な良かった点（スクリプトの単語を引用）"],"improvements":["具体的な改善点1（どの単語をどう直すか）","具体的な改善点2"],"nextStepAdvice":"次の練習で1つだけ意識すること","canAdvance":false}\n\n- score: 0-100 based on actual performance\n- passed=true and canAdvance=true if score>=70(reading) or score>=75(shadowing)\n- Write ALL values in Japanese\n- Reference specific words from the script in feedback\n- For pronunciation improvements, use this format: word: syl-LA-ble (uppercase = stress). Example: \"European: eu-RO-pe-an。ROに強勢。\"\n- Katakana-only explanations are forbidden; pairing with syllable notation is OK\n- Never write comparisons like \"AではなくA\" where both sides are identical'
          },
          {
            inline_data: {
              mime_type: mtype,
              data: b64
            }
          }
        ]
      }],
      generationConfig: {temperature: 0.3}
    };

    fetch(GEM_URL + '?key=' + GEM_KEY, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    }).then(function(res) {
      return res.json();
    }).then(function(data) {
      if (data.error) throw new Error('Gemini: ' + data.error.message + ' (code:' + data.error.code + ')');
      if (!data.candidates || !data.candidates[0]) throw new Error('レスポンスなし: ' + JSON.stringify(data).substring(0, 150));
      var txt = data.candidates[0].content.parts[0].text || '';
      var clean = txt.replace(/```json|```/g, '').trim();
      var result;
      try {
        result = JSON.parse(clean);
      } catch(e) {
        // Fallback values
        result = {score:65,passed:false,scoreLabel:'Keep Going',strengths:['練習継続中'],improvements:['引き続き練習しましょう'],nextStepAdvice:'もう少し練習してから進みましょう',canAdvance:false};
      }
      showAIFeedback(result, mode);
    }).catch(function(e) {
      var fa2 = document.getElementById('fbArea');
      if (fa2) fa2.innerHTML = '<div class="fb-card">'
        + '<div style="font-size:13px;color:var(--text2);margin-bottom:6px">⚠️ AI評価エラー</div>'
        + '<div style="font-size:11px;color:var(--red);background:var(--bg3);padding:8px;border-radius:6px;margin-bottom:10px;word-break:break-all">' + (e.message || '不明なエラー') + '</div>'
        + '<div style="display:flex;gap:8px">'
        + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="selfEval(\'bad\',\'' + mode + '\')">😕 難しい</button>'
        + '<button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="selfEval(\'ok\',\'' + mode + '\')">🙂 まあまあ</button>'
        + '<button class="btn btn-primary" style="flex:1;font-size:13px" onclick="selfEval(\'good\',\'' + mode + '\')">😄 できた</button>'
        + '</div></div>';
    });
  };
  reader.readAsDataURL(blob);
}

// ============================================================
// SELF EVAL
// ============================================================
function selfEval(lv, mode) {
  var s = lv === 'good' ? 85 : lv === 'ok' ? 65 : 45;
  var passed = lv !== 'bad';
  showAIFeedback({
    score: s,
    passed: passed,
    scoreLabel: lv === 'good' ? 'Great!' : lv === 'ok' ? 'Good' : 'Keep Going',
    strengths: [lv === 'good' ? 'スムーズに話せました' : lv === 'ok' ? '概ね理解しながら話せました' : '基礎を固めましょう'],
    improvements: [lv === 'good' ? 'さらに速度を上げてみましょう' : lv === 'ok' ? 'もう数回繰り返して定着させましょう' : '意味確認に戻って再度練習しましょう'],
    nextStepAdvice: lv === 'good' ? '次のスクリプトか速度アップに挑戦！' : 'もう2〜3回練習してから次へ進みましょう',
    canAdvance: passed
  }, mode);
}

function showAIFeedback(r, mode) {
  var fa = document.getElementById('fbArea');
  if (!fa) return;
  var col = r.score >= 75 ? '#22c55e' : r.score >= 55 ? '#f59e0b' : '#ef4444';
  var str = (r.strengths || []).map(function(s) { return '<li class="advice-item"><span>✅</span>' + s + '</li>'; }).join('');
  var imp = (r.improvements || []).map(function(s) { return '<li class="advice-item"><span>💡</span>' + s + '</li>'; }).join('');
  var nextBtn = '';
  if (r.canAdvance) {
    if (mode === 'reading') {
      unlock('shadowing');
      nextBtn = '<button class="btn btn-green" style="margin-top:10px" onclick="switchTab(\'shadowing\')">🎉 クリア！③シャドーイングへ →</button>';
    } else {
      nextBtn = '<button class="btn btn-green" style="margin-top:10px" onclick="showToast(\'全モードクリア！🎊\',true)">🎊 全モードクリア！</button>';
    }
  } else {
    nextBtn = '<div style="font-size:13px;color:var(--text2);padding:10px;background:var(--bg3);border-radius:8px;margin-top:8px">📌 ' + r.nextStepAdvice + '</div>';
  }
  var audioReplay = lastRecDataUrl
    ? '<div style="margin-bottom:12px"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">🎧 録音を再生する</div><audio controls style="width:100%;height:40px" src="' + lastRecDataUrl + '"></audio></div>'
    : '';
  fa.innerHTML = '<div class="fb-card">'
    + '<div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em">評価結果</div>'
    + audioReplay
    + '<div class="score-row">'
    + '<div class="score-circle" style="background:' + col + '">' + r.score + '</div>'
    + '<div><div style="font-size:18px;font-weight:700;color:var(--text)">' + r.scoreLabel + '</div>'
    + '<div style="font-size:11px;color:var(--text2)">' + (r.passed ? '✅ クリア' : '練習を続けましょう') + '</div></div>'
    + '</div>'
    + '<ul class="advice-list">' + str + imp + '</ul>'
    + nextBtn + '</div>';
  addHist(mode, r.score, r);
  if (r.passed) {
    addPts(mode === 'reading' ? 20 : 30);
    if (mode === 'reading') readOk++;
    else shadOk++;
  }
  updateLevel();
  if (current) {
    if (!scriptProgress[current.id]) scriptProgress[current.id] = {};
    var sp = scriptProgress[current.id];
    sp.lastScore = r.score;
    sp.lastDate = new Date().toISOString().split('T')[0];
    if (mode === 'reading' && r.passed) sp.readCleared = true;
    if (mode === 'shadowing' && r.passed) sp.shadCleared = true;
    sp.readOk = readOk;
    sp.shadOk = shadOk;
    saveScriptProgress();
  }
}

// ============================================================
// AUDIO PLAYBACK
// ============================================================
function doSpeak() {
  if (!current) return;
  synth.cancel();
  var u = new SpeechSynthesisUtterance(current.raw);
  u.rate = rate;
  u.lang = 'en-US';
  dur = (current.raw.split(/\s+/).length / (200 * rate)) * 60;
  elapsed = 0;
  u.onstart = function() { playing = true; paused = false; updateBtn(); setSt('playing', '再生中'); startProg(); };
  u.onboundary = function(e) { if (e.name === 'word') highlightWord(e.charIndex); };
  u.onend = function() {
    playing = false; paused = false; updateBtn();
    var pf = document.getElementById('pFill');
    if (pf) pf.style.width = '100%';
    clearInterval(iv);
    setSt('', '終了');
    if (isRec) stopRec();
    if (repeat) setTimeout(doSpeak, 800);
  };
  u.onerror = function() { playing = false; paused = false; updateBtn(); clearInterval(iv); };
  synth.speak(u);
}

function highlightWord(charIndex) {
  var wels = document.querySelectorAll('#sd .word');
  if (!wels.length) return;
  if (!window._wmap || window._wmap.id !== current.id) {
    var text = current.raw.trim();
    var map = [];
    var ci = 0;
    text.split(/(\s+)/).forEach(function(token) {
      if (/\S/.test(token)) map.push({s: ci, e: ci + token.length});
      ci += token.length;
    });
    window._wmap = {id: current.id, map: map};
  }
  var map = window._wmap.map;
  var found = map.length - 1;
  for (var i = 0; i < map.length; i++) {
    if (charIndex >= map[i].s && charIndex < map[i].e) { found = i; break; }
    if (charIndex < map[i].s) { found = i; break; }
  }
  wels.forEach(function(el, i) {
    if (i < found) el.className = 'word done';
    else if (i === found) { el.className = 'word active'; el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
    else el.className = 'word';
  });
}

function togglePlay() {
  if (playing) {
    synth.pause();
    elapsed += (Date.now() - startT) / 1000;
    clearInterval(iv);
    playing = false; paused = true;
    updateBtn(); setSt('paused', '一時停止中');
  } else if (paused) {
    synth.resume();
    playing = true; paused = false;
    updateBtn(); setSt('playing', '再生中'); startProg();
  } else {
    doSpeak();
  }
}

function stopAll() {
  synth.cancel();
  clearInterval(iv);
  playing = false; paused = false; elapsed = 0;
  var pf = document.getElementById('pFill'); if (pf) pf.style.width = '0%';
  var tc = document.getElementById('tCur'); if (tc) tc.textContent = '0:00';
  var tt = document.getElementById('tTot'); if (tt) tt.textContent = '0:00';
  updateBtn(); setSt('', '待機中');
  document.querySelectorAll('.word').forEach(function(el) { el.className = 'word'; });
}

function setRate(r) {
  rate = r;
  document.querySelectorAll('.speed-btn').forEach(function(b) {
    b.classList.toggle('active', parseFloat(b.getAttribute('data-r')) === r);
  });
  if (playing || paused) stopAll();
}

function toggleRepeat() {
  repeat = !repeat;
  document.getElementById('toggle').classList.toggle('on', repeat);
}

function updateBtn() {
  var b = document.getElementById('playBtn');
  if (b) b.textContent = playing ? '⏸ 一時停止' : '▶ 再生';
}

function setSt(type, txt) {
  var d = document.getElementById('dot');
  if (d) d.className = 'sdot' + (type ? ' ' + type : '');
  var s = document.getElementById('stxt');
  if (s) s.textContent = txt;
}

function fmt(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startProg() {
  startT = Date.now();
  clearInterval(iv);
  iv = setInterval(function() {
    var e = elapsed + (Date.now() - startT) / 1000;
    var p = Math.min(e / dur, 1);
    var pf = document.getElementById('pFill'); if (pf) pf.style.width = (p * 100) + '%';
    var tc = document.getElementById('tCur'); if (tc) tc.textContent = fmt(e);
    var tt = document.getElementById('tTot'); if (tt) tt.textContent = fmt(dur);
  }, 200);
}

function speakText(text) {
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  synth.speak(u);
}

// ============================================================
// PROGRESS
// ============================================================
function addHist(mode, score, feedback) {
  practiceHistory.unshift({
    mode: mode, score: score, rate: rate,
    title: current ? current.title : '',
    date: new Date().toLocaleDateString('ja-JP'),
    strengths: feedback ? feedback.strengths : [],
    improvements: feedback ? feedback.improvements : [],
    nextStepAdvice: feedback ? feedback.nextStepAdvice : '',
    scoreLabel: feedback ? feedback.scoreLabel : '',
    audioUrl: lastRecDataUrl
  });
}

function addPts(p) { points += p; updateLevel(); }

function updateLevel() {
  var lv = Math.floor(points / 100) + 1;
  document.getElementById('lvlLbl').textContent = 'Level ' + lv;
  document.getElementById('lvlVal').textContent = (points % 100) + ' / 100 pts';
  document.getElementById('lvlFill').style.width = (points % 100) + '%';
}

function renderProgress(c) {
  var total = practiceHistory.length;
  var avg = total ? Math.round(practiceHistory.reduce(function(s, h) { return s + h.score; }, 0) / total) : 0;
  var gb = function(s) { return s >= 85 ? '🥇' : s >= 70 ? '🥈' : '🥉'; };

  var histHTML = practiceHistory.slice(0, 20).map(function(h, i) {
    var html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden">';
    // Header row
    html += '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer" onclick="toggleHistDetail(' + i + ')">';
    html += '<span class="hmode ' + (h.mode === 'reading' ? 'hm-r' : 'hm-s') + '">' + (h.mode === 'reading' ? '音読' : 'シャドーイング') + '</span>';
    html += '<div style="flex:1">';
    html += '<div style="font-size:14px;font-weight:700;color:var(--text)">' + h.score + '点 ' + gb(h.score) + (h.scoreLabel ? ' · ' + h.scoreLabel : '') + '</div>';
    html += '<div style="font-size:11px;color:var(--text2)">' + h.title.substring(0,12) + ' · ×' + h.rate + ' · ' + h.date + '</div>';
    html += '</div>';
    html += '<span style="font-size:12px;color:var(--text3)">▼</span>';
    html += '</div>';
    // Detail (hidden by default)
    html += '<div id="hist-detail-' + i + '" style="display:none;padding:0 12px 12px">';
    if (h.audioUrl) {
      html += '<div style="margin-bottom:8px"><div style="font-size:11px;color:var(--text2);margin-bottom:3px">🎧 録音</div><audio controls style="width:100%;height:36px" src="' + h.audioUrl + '"></audio></div>';
    }
    if (h.strengths && h.strengths.length > 0) {
      html += '<div style="font-size:12px;color:var(--green);margin-bottom:4px">✅ ' + h.strengths.join('<br>✅ ') + '</div>';
    }
    if (h.improvements && h.improvements.length > 0) {
      html += '<div style="font-size:12px;color:var(--amber);margin-bottom:4px">💡 ' + h.improvements.join('<br>💡 ') + '</div>';
    }
    if (h.nextStepAdvice) {
      html += '<div style="font-size:12px;color:var(--text2);padding:6px 8px;background:var(--bg3);border-radius:6px">📌 ' + h.nextStepAdvice + '</div>';
    }
    html += '</div></div>';
    return html;
  }).join('') || '<div style="font-size:13px;color:var(--text2)">まだ記録がありません</div>';

  var recBtn = total > 0
    ? '<button class="btn btn-primary" style="margin-top:12px" onclick="openRecord()">📝 この記録をGitHubに保存</button>'
    : '';

  c.innerHTML = '<div style="max-width:600px;margin:0 auto">'
    + '<div class="sec-title">📊 今セッションの記録</div>'
    + '<div class="stat-grid">'
    + '<div class="stat-card"><div class="stat-num">' + readOk + '</div><div class="stat-lbl">音読クリア</div></div>'
    + '<div class="stat-card"><div class="stat-num">' + shadOk + '</div><div class="stat-lbl">シャドーイングクリア</div></div>'
    + '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-lbl">総セッション</div></div>'
    + '<div class="stat-card"><div class="stat-num">' + avg + '</div><div class="stat-lbl">平均スコア</div></div>'
    + '</div>'
    + '<div class="sec-title">📝 履歴（タップで詳細）</div>'
    + histHTML + recBtn
    + '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<div class="sec-title" style="margin:0">🎙 過去の録音</div>'
    + '<button class="btn btn-secondary btn-sm" onclick="loadPastRecordings()">読み込む</button>'
    + '</div>'
    + '<div id="pastRecArea"><div style="font-size:12px;color:var(--text3)">「読み込む」を押すとGitHubから取得します</div></div>'
    + '</div>'
    + '</div>';
}

function toggleHistDetail(i) {
  var el = document.getElementById('hist-detail-' + i);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}


// ============================================================
// GITHUB RECORD
// ============================================================
function openRecord() {
  var avgScore = practiceHistory.length ? Math.round(practiceHistory.reduce(function(s, h) { return s + h.score; }, 0) / practiceHistory.length) : 0;
  document.getElementById('recSum').innerHTML =
    '<span>スクリプト: <b>' + (current ? current.title : '未選択') + '</b></span>'
    + '<span>音読クリア: <b>' + readOk + '回</b></span>'
    + '<span>シャドーイングクリア: <b>' + shadOk + '回</b></span>'
    + '<span>速度: <b>×' + rate.toFixed(1) + '</b></span>'
    + '<span>平均スコア: <b>' + avgScore + '点</b></span>';
  document.getElementById('recOverlay').classList.add('open');
}

function closeRecord() { document.getElementById('recOverlay').classList.remove('open'); }

function overlayBg(e) { if (e.target === document.getElementById('recOverlay')) closeRecord(); }

function saveRecord() {
  var memo = document.getElementById('recMemo').value;
  var now = new Date();
  var dateStr = now.toISOString().split('T')[0];
  var timeStr = now.toTimeString().slice(0, 5);
  var avgScore = practiceHistory.length ? Math.round(practiceHistory.reduce(function(s, h) { return s + h.score; }, 0) / practiceHistory.length) : 0;
  var btn = document.getElementById('recSaveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span> 保存中...';

  var lines = [
    '# 学習記録 ' + dateStr + ' ' + timeStr,
    '',
    '## スクリプト',
    current ? current.title : '未選択',
    '',
    '## 記録',
    '- 音読クリア: ' + readOk + '回',
    '- シャドーイングクリア: ' + shadOk + '回',
    '- 速度: ×' + rate.toFixed(1),
    '- 平均スコア: ' + avgScore + '点'
  ];
  if (memo) lines.push('- メモ: ' + memo);
  if (lastSavedRecUrl) {
    lines.push('', '## 録音');
    lines.push('[🎧 再生](' + lastSavedRecUrl + ')');
    lines.push('');
    lines.push('`' + lastSavedRecUrl + '`');
  }
  lines.push('', '## セッション詳細');
  practiceHistory.forEach(function(h) {
    lines.push('- ' + (h.mode === 'reading' ? '音読' : 'シャドーイング') + ': ' + h.score + '点 ×' + h.rate);
  });

  var content = lines.join('\n');
  var path = 'records/' + dateStr + '-' + timeStr.replace(':', '-') + '.md';

  // base64 encode
  var encoded = btoa(unescape(encodeURIComponent(content)));

  fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path, {
    method: 'PUT',
    headers: {'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json'},
    body: JSON.stringify({message: '学習記録: ' + dateStr + (current ? ' ' + current.title : ''), content: encoded})
  }).then(function(res) {
    return res.json().then(function(data) { return {ok: res.ok, data: data}; });
  }).then(function(r) {
    btn.disabled = false;
    btn.textContent = 'GitHubに保存する';
    if (r.ok) { showToast('✓ GitHubに保存しました', true); closeRecord(); }
    else showToast('保存に失敗: ' + (r.data.message || ''), false);
  }).catch(function(e) {
    btn.disabled = false;
    btn.textContent = 'GitHubに保存する';
    showToast('エラーが発生しました', false);
  });
}

// ============================================================
// PAST RECORDINGS
// ============================================================
function loadPastRecordings() {
  if (!GH_TOKEN) {
    showToast('URLにgh=トークンが必要です', false);
    return;
  }
  var el = document.getElementById('pastRecArea');
  if (el) el.innerHTML = '<div style="text-align:center;padding:12px"><span class="spinner"></span><div style="font-size:12px;color:var(--text2);margin-top:6px">読み込み中...</div></div>';
  fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/recordings', {
    headers: {'Authorization': 'Bearer ' + GH_TOKEN}
  }).then(function(r) {
    if (r.status === 404) return [];
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(files) {
    if (!Array.isArray(files) || files.length === 0) {
      if (el) el.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:8px">録音がまだありません</div>';
      return;
    }
    files.sort(function(a, b) { return b.name.localeCompare(a.name); });
    // スクリプトID・モードの固定対応表
    var scriptNameMap = {short:'自己紹介 ショート版', casual:'自己紹介 カジュアル版', formal:'自己紹介 フォーマル版'};
    var modeNameMap   = {reading:'音読', shadowing:'シャドーイング'};

    var html = files.slice(0, 20).map(function(f) {
      var rawUrl = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/main/recordings/' + f.name;
      var base = f.name.replace(/\.(m4a|webm|ogg|mp4)$/, '');
      var parts = base.split('-');
      // 新形式: YYYY-MM-DD-HH-MM-{scriptId}-{mode}  (7部分)
      // 旧形式: YYYY-MM-DD-HH-MM-{mode}              (6部分)
      var scriptId, modeKey;
      if (parts.length >= 7) {
        scriptId = parts[5];
        modeKey  = parts[6];
      } else {
        scriptId = '';
        modeKey  = parts[5] || '';
      }
      var dateLabel = (parts[0]||'') + '-' + (parts[1]||'') + '-' + (parts[2]||'')
        + ' ' + (parts[3]||'') + ':' + (parts[4]||'');
      var scriptLabel = scriptId ? (scriptNameMap[scriptId] || scriptId) : '';
      var modeStr = modeNameMap[modeKey] || modeKey;
      var titleLine = dateLabel
        + (scriptLabel ? ' · ' + scriptLabel : '')
        + ' · ' + modeStr;
      return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px">'
        + '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:5px">' + titleLine + '</div>'
        + '<audio controls style="width:100%;height:36px" src="' + rawUrl + '"></audio>'
        + '</div>';
    }).join('');
    if (el) el.innerHTML = html;
  }).catch(function(e) {
    if (el) el.innerHTML = '<div style="font-size:12px;color:var(--red);padding:8px">読み込みエラー: ' + e.message + '</div>';
  });
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}
</script>
