<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shadowing Practice</title>
<style>
:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#3a3a3a;--accent:#7c6ff7;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#38bdf8;}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f5;--bg2:#fff;--bg3:#efefef;--text:#111;--text2:#555;--text3:#999;--border:#ddd;--accent:#635fd2;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#0284c7;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.app-title{font-size:16px;font-weight:700;color:var(--text)}
.level-wrap{padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.level-row{display:flex;justify-content:space-between;margin-bottom:4px}
.level-lbl{font-size:11px;color:var(--text2);font-weight:600}
.level-val{font-size:11px;color:var(--accent);font-weight:700}
.level-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.level-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:2px;transition:width .6s}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.tab{flex:1;padding:10px 0;font-size:11px;font-weight:600;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.locked{color:var(--text3);cursor:not-allowed}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.controls{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px 22px}
.speed-row{display:flex;gap:6px;margin-bottom:8px}
.speed-btn{flex:1;padding:7px 0;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.speed-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.prog-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-bottom:5px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:var(--accent);transition:width .3s linear}
.time-row{display:flex;justify-content:space-between;margin-bottom:8px}
.time-txt{font-size:11px;color:var(--text2)}
.play-row{display:flex;gap:8px;margin-bottom:8px}
.btn-play{flex:1;padding:12px;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer;border:none;background:var(--accent);color:#fff}
.btn-stop{padding:12px 15px;font-size:15px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.bot-row{display:flex;align-items:center;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.sdot.playing{background:var(--green)}.sdot.paused{background:var(--amber)}
.stxt{font-size:12px;color:var(--text2);flex:1}
.rep-row{display:flex;align-items:center;gap:6px;cursor:pointer}
.rep-lbl{font-size:12px;color:var(--text2)}
.toggle{width:32px;height:18px;border-radius:9px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.knob{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s}
.toggle.on .knob{left:16px}
.btn{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.sec-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.script-card{padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer}
.script-card.selected{border-color:var(--accent)}
.script-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.script-card-meta{font-size:12px;color:var(--text2);margin-bottom:5px}
.script-card-preview{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sent-block{margin-bottom:10px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
.sent-en{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:5px}
.sent-ja{font-size:13px;line-height:1.7;color:var(--text2);padding-top:5px;border-top:1px solid var(--border)}
.vocab-item{padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.vocab-word{font-size:14px;font-weight:700;color:var(--accent)}
.vocab-pron{font-size:12px;color:var(--text2);margin:2px 0}
.vocab-meaning{font-size:13px;color:var(--text)}
.vocab-ex{font-size:12px;color:var(--text3);font-style:italic;margin-top:3px}
.script-display{font-size:16px;line-height:2.4;color:var(--text);white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.word{display:inline}
.word.active{background:var(--accent);color:#fff;padding:1px 3px;border-radius:4px}
.word.done{color:var(--text3)}
.slash-marker{color:var(--accent);font-weight:700;font-size:15px;margin:0 1px}
.fb-card{padding:14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);margin-top:10px}
.fb-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.score-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.advice-list{list-style:none}
.advice-item{font-size:13px;color:var(--text);padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
.advice-item:last-child{border:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.hmode{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;flex-shrink:0}
.hm-r{background:var(--green)}.hm-s{background:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end}
.overlay.open{opacity:1;pointer-events:all}
.sheet{width:100%;background:var(--bg2);border-radius:16px 16px 0 0;padding:20px 16px 32px;transform:translateY(100%);transition:transform .25s}
.overlay.open .sheet{transform:translateY(0)}
.sheet-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);outline:none;font-family:inherit}
.sum-box{display:flex;flex-wrap:wrap;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--text2)}
.sum-box b{color:var(--text)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border-radius:20px;padding:8px 16px;font-size:13px;white-space:nowrap;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.ok{border:1px solid var(--green);color:var(--green)}
.toast.err{border:1px solid var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="app-title">🎙 Shadowing</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="openRecord()">📝 記録</button>
      <button class="btn btn-secondary btn-sm" onclick="switchTab('pick')">📂 変更</button>
    </div>
  </div>
  <div class="level-wrap">
    <div class="level-row"><span class="level-lbl" id="lvlLbl">Level 1</span><span class="level-val" id="lvlVal">0 / 100 pts</span></div>
    <div class="level-bar"><div class="level-fill" id="lvlFill" style="width:0%"></div></div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-pick" onclick="switchTab('pick')">選択</div>
    <div class="tab locked" id="tab-meaning" onclick="switchTab('meaning')">①意味</div>
    <div class="tab locked" id="tab-reading" onclick="switchTab('reading')">②音読</div>
    <div class="tab locked" id="tab-shadowing" onclick="switchTab('shadowing')">③シャドーイング</div>
    <div class="tab" id="tab-progress" onclick="switchTab('progress')">記録</div>
  </div>
  <div class="content" id="content"></div>
  <div class="controls" id="controls" style="display:none">
    <div class="speed-row">
      <button class="speed-btn" data-r="0.5" onclick="setRate(0.5)">×0.5</button>
      <button class="speed-btn active" data-r="0.7" onclick="setRate(0.7)">×0.7</button>
      <button class="speed-btn" data-r="1.0" onclick="setRate(1.0)">×1.0</button>
      <button class="speed-btn" data-r="1.2" onclick="setRate(1.2)">×1.2</button>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="pFill"></div></div>
    <div class="time-row"><span class="time-txt" id="tCur">0:00</span><span class="time-txt" id="tTot">0:00</span></div>
    <div class="play-row">
      <button class="btn-play" id="playBtn" onclick="togglePlay()">▶ 再生</button>
      <button class="btn-stop" onclick="stopAll()">⏹</button>
    </div>
    <div class="bot-row">
      <div class="sdot" id="dot"></div>
      <span class="stxt" id="stxt">待機中</span>
      <div class="rep-row" onclick="toggleRepeat()">
        <span class="rep-lbl">🔁</span>
        <div class="toggle" id="toggle"><div class="knob"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- 記録overlay -->
<div class="overlay" id="recOverlay" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="sheet-title">📝 GitHubに学習記録を保存</div>
    <div class="field"><label>気づき・改善点（任意）</label><input id="recMemo" placeholder="例: regulatory の発音を意識する"></div>
    <div class="sum-box" id="recSum"></div>
    <button class="btn btn-primary" id="recSaveBtn" onclick="saveRecord()">GitHubに保存する</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeRecord()">キャンセル</button>
  </div>
</div>
<div class="toast" id="toast"></div>

// ===== TABS =====
function switchTab(tab) {
  if (!['pick','progress'].includes(tab) && !unlocked.includes(tab)) {
    showToast('前のステップをクリアしてください', false); return;
  }
  stopAll();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById('tab-' + tab); if (el) el.classList.add('active');
  document.getElementById('controls').style.display = (tab==='reading'||tab==='shadowing') ? '' : 'none';
  renderTab(tab);
}

function unlock(tab) {
  if (!unlocked.includes(tab)) unlocked.push(tab);
  const el = document.getElementById('tab-' + tab); if (el) el.classList.remove('locked');
}

function renderTab(tab) {
  const c = document.getElementById('content');
  if (tab==='pick') renderPick(c);
  else if (tab==='meaning') renderMeaning(c);
  else if (tab==='reading') renderReading(c);
  else if (tab==='shadowing') renderShadowing(c);
  else if (tab==='progress') renderProgress(c);
}

// ===== WORD BUILDER =====
function buildWordSpans(text) {
  return text.trim().split(/(\s+)/).map((w, i) =>
    /\S/.test(w) ? `<span class="word" id="w${i}">${w}</span>` : ' '
  ).join('');
}

function buildBreathDisplay() {
  if (!current || !current.breathGroups) return buildWordSpans(current.raw);
  const groups = current.breathGroups;
  // Build word→group mapping
  const allGroupWords = groups.map(g =>
    g.split(/\s+/).filter(w => w.length > 0)
  );
  // Flatten to get ordered word list with group index
  let wordGroupMap = [];
  allGroupWords.forEach((gw, gi) => {
    gw.forEach(() => wordGroupMap.push(gi));
  });

  const tokens = current.raw.trim().split(/(\s+)/);
  let wordIdx = 0;
  let prevGroup = -1;
  let out = '<div class="script-display" style="line-height:2.6">';

  tokens.forEach(token => {
    if (/\S/.test(token)) {
      const gi = wordGroupMap[wordIdx] !== undefined ? wordGroupMap[wordIdx] : wordGroupMap[wordGroupMap.length-1];
      // Insert slash before first word of new group (not the very first)
      if (showBreath && gi !== prevGroup && prevGroup !== -1) {
        out += `<span class="slash-marker"> /</span> `;
      }
      out += `<span class="word" id="w${wordIdx}">${token}</span>`;
      prevGroup = gi;
      wordIdx++;
    } else if (!/\n/.test(token)) {
      out += ' ';
    } else {
      out += '<br><br>';
    }
  });
  out += '</div>';
  return out;
}

// ===== SELF EVAL =====
function selfEval(lv, mode) {
  const s = lv==='good'?85:lv==='ok'?65:45;
  const passed = lv !== 'bad';
  const col = s>=75?'#22c55e':s>=55?'#f59e0b':'#ef4444';
  const str = lv==='good'?'スムーズに話せました':lv==='ok'?'概ね理解しながら話せました':'基礎を固めましょう';
  const imp = lv==='good'?'さらに速度を上げてみましょう':lv==='ok'?'もう数回繰り返して定着させましょう':'意味確認に戻って再度練習しましょう';
  const adv = lv==='good'?'次のスクリプトか速度アップに挑戦！':'もう2〜3回練習してから次へ進みましょう';

  let nextBtn = '';
  if (passed) {
    if (mode==='reading') {
      unlock('shadowing');
      nextBtn = `<button class="btn btn-green" style="margin-top:10px" onclick="switchTab('shadowing')">🎉 クリア！③シャドーイングへ →</button>`;
    } else {
      nextBtn = `<button class="btn btn-green" style="margin-top:10px" onclick="showToast('全モードクリア！🎊',true)">🎊 全モードクリア！</button>`;
    }
  } else {
    nextBtn = `<div style="font-size:13px;color:var(--text2);padding:10px;background:var(--bg3);border-radius:8px;margin-top:8px">📌 ${adv}</div>`;
  }

  const fa = document.getElementById('fbArea'); if (!fa) return;
  fa.innerHTML = `
    <div class="fb-card">
      <div class="fb-title">評価結果</div>
      <div class="score-row">
        <div class="score-circle" style="background:${col}">${s}</div>
        <div><div style="font-size:18px;font-weight:700;color:var(--text)">${lv==='good'?'Great!':lv==='ok'?'Good':'Keep Going'}</div>
        <div style="font-size:11px;color:var(--text2)">${passed?'✅ クリア':'練習を続けましょう'}</div></div>
      </div>
      <ul class="advice-list">
        <li class="advice-item"><span>✅</span>${str}</li>
        <li class="advice-item"><span>💡</span>${imp}</li>
      </ul>
      ${nextBtn}
    </div>`;

  addHist(mode, s);
  if (passed) { addPts(mode==='reading'?20:30); if(mode==='reading')readOk++;else shadOk++; }
  updateLevel();
}

// ===== AUDIO =====
function doSpeak() {
  if (!current) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(current.raw);
  u.rate = rate; u.lang = 'en-US';
  dur = (current.raw.split(/\s+/).length / (200 * rate)) * 60;
  elapsed = 0;
  u.onstart = () => { playing=true;paused=false;updateBtn();setSt('playing','再生中');startProg(); };
  u.onboundary = (e) => { if (e.name==='word') highlightWord(e.charIndex); };
  u.onend = () => {
    playing=false;paused=false;updateBtn();
    const pf=document.getElementById('pFill');if(pf)pf.style.width='100%';
    clearInterval(iv);setSt('','終了');
    if (repeat) setTimeout(doSpeak, 800);
  };
  u.onerror = () => { playing=false;paused=false;updateBtn();clearInterval(iv); };
  synth.speak(u);
}

function highlightWord(charIndex) {
  const wels = document.querySelectorAll('#sd .word');
  if (!wels.length) return;
  if (!window._wmap || window._wmap.id !== current.id) {
    const text = current.raw.trim();
    let map = [], ci = 0;
    text.split(/(\s+)/).forEach(token => {
      if (/\S/.test(token)) { map.push({s:ci, e:ci+token.length}); }
      ci += token.length;
    });
    window._wmap = { id: current.id, map };
  }
  const map = window._wmap.map;
  let found = map.length - 1;
  for (let i = 0; i < map.length; i++) {
    if (charIndex >= map[i].s && charIndex < map[i].e) { found = i; break; }
    if (charIndex < map[i].s) { found = i; break; }
  }
  wels.forEach((el, i) => {
    if (i < found) el.className = 'word done';
    else if (i === found) { el.className = 'word active'; el.scrollIntoView({block:'center',behavior:'smooth'}); }
    else el.className = 'word';
  });
}

function togglePlay() {
  if (playing) {
    synth.pause(); elapsed+=(Date.now()-startT)/1000; clearInterval(iv);
    playing=false;paused=true;updateBtn();setSt('paused','一時停止中');
  } else if (paused) {
    synth.resume(); playing=true;paused=false;updateBtn();setSt('playing','再生中');startProg();
  } else { doSpeak(); }
}

function stopAll() {
  synth.cancel(); clearInterval(iv);
  playing=false;paused=false;elapsed=0;
  const pf=document.getElementById('pFill');if(pf)pf.style.width='0%';
  const tc=document.getElementById('tCur');if(tc)tc.textContent='0:00';
  const tt=document.getElementById('tTot');if(tt)tt.textContent='0:00';
  updateBtn();setSt('','待機中');
  document.querySelectorAll('.word').forEach(el=>el.className='word');
}

function setRate(r) {
  rate=r;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseFloat(b.dataset.r)===r));
  if(playing||paused)stopAll();
}
function toggleRepeat(){repeat=!repeat;document.getElementById('toggle').classList.toggle('on',repeat);}
function updateBtn(){const b=document.getElementById('playBtn');if(b)b.textContent=playing?'⏸ 一時停止':'▶ 再生';}
function setSt(type,txt){const d=document.getElementById('dot');if(d)d.className='sdot'+(type?' '+type:'');const s=document.getElementById('stxt');if(s)s.textContent=txt;}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function startProg() {
  startT=Date.now();clearInterval(iv);
  iv=setInterval(()=>{
    const e=elapsed+(Date.now()-startT)/1000;
    const p=Math.min(e/dur,1);
    const pf=document.getElementById('pFill');if(pf)pf.style.width=(p*100)+'%';
    const tc=document.getElementById('tCur');if(tc)tc.textContent=fmt(e);
    const tt=document.getElementById('tTot');if(tt)tt.textContent=fmt(dur);
  },200);
}

function speakText(text) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.85;
  synth.speak(u);
}

// ===== PROGRESS =====
function addHist(mode,score){history.unshift({mode,score,rate,title:current?current.title:'',date:new Date().toLocaleDateString('ja-JP')});}
function addPts(p){points+=p;updateLevel();}
function updateLevel(){
  const lv=Math.floor(points/100)+1;
  document.getElementById('lvlLbl').textContent='Level '+lv;
  document.getElementById('lvlVal').textContent=(points%100)+' / 100 pts';
  document.getElementById('lvlFill').style.width=(points%100)+'%';
}

function renderProgress(c) {
  const total=history.length;
  const avg=total?Math.round(history.reduce((s,h)=>s+h.score,0)/total):0;
  const gb=s=>s>=85?'🥇':s>=70?'🥈':'🥉';
  c.innerHTML=`
    <div style="max-width:600px;margin:0 auto">
      <div class="sec-title">📊 今セッションの記録</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${readOk}</div><div class="stat-lbl">音読クリア</div></div>
        <div class="stat-card"><div class="stat-num">${shadOk}</div><div class="stat-lbl">シャドーイングクリア</div></div>
        <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">総セッション</div></div>
        <div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-lbl">平均スコア</div></div>
      </div>
      <div class="sec-title">📝 履歴</div>
      ${history.slice(0,20).map(h=>`
        <div class="hist-item">
          <span class="hmode ${h.mode==='reading'?'hm-r':'hm-s'}">${h.mode==='reading'?'音読':'シャドーイング'}</span>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${h.score}点 ${gb(h.score)}</div>
            <div style="font-size:11px;color:var(--text2)">${h.title} · ×${h.rate} · ${h.date}</div>
          </div>
        </div>`).join('')||'<div style="font-size:13px;color:var(--text2)">まだ記録がありません</div>'}
      ${total>0?`<button class="btn btn-primary" style="margin-top:12px" onclick="openRecord()">📝 この記録をGitHubに保存</button>`:''}
    </div>`;
}

// ===== GITHUB RECORD =====
function openRecord() {
  document.getElementById('recSum').innerHTML=`
    <span>スクリプト: <b>${current?current.title:'未選択'}</b></span>
    <span>音読クリア: <b>${readOk}回</b></span>
    <span>シャドーイングクリア: <b>${shadOk}回</b></span>
    <span>速度: <b>×${rate.toFixed(1)}</b></span>
    <span>平均スコア: <b>${history.length?Math.round(history.reduce((s,h)=>s+h.score,0)/history.length):0}点</b></span>`;
  document.getElementById('recOverlay').classList.add('open');
}
function closeRecord(){document.getElementById('recOverlay').classList.remove('open');}
function overlayBg(e){if(e.target===document.getElementById('recOverlay'))closeRecord();}

async function saveRecord() {
  const memo = document.getElementById('recMemo').value;
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const timeStr = now.toTimeString().slice(0,5);
  const avgScore = history.length?Math.round(history.reduce((s,h)=>s+h.score,0)/history.length):0;
  const btn = document.getElementById('recSaveBtn');
  btn.disabled=true;btn.innerHTML='<span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span> 保存中...';

  const content = [
    `# 学習記録 ${dateStr} ${timeStr}`,
    ``,
    `## スクリプト`,
    `${current?current.title:'未選択'}`,
    ``,
    `## 記録`,
    `- 音読クリア: ${readOk}回`,
    `- シャドーイングクリア: ${shadOk}回`,
    `- 速度: ×${rate.toFixed(1)}`,
    `- 平均スコア: ${avgScore}点`,
    memo?`- メモ: ${memo}`:'',
    ``,
    `## セッション詳細`,
    ...history.map(h=>`- ${h.mode==='reading'?'音読':'シャドーイング'}: ${h.score}点 ×${h.rate}`),
  ].filter(l=>l!==null).join('\n');

  const path = `records/${dateStr}-${timeStr.replace(':','-')}.md`;
  const encoded = btoa(unescape(encodeURIComponent(content)));

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${GH_TOKEN}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        message: `学習記録: ${dateStr} ${current?current.title:''}`,
        content: encoded
      })
    });
    const data = await res.json();
    btn.disabled=false;btn.textContent='GitHubに保存する';
    if (res.ok) {
      showToast('✓ GitHubに保存しました', true);
      closeRecord();
    } else {
      showToast('保存に失敗: '+( data.message||''), false);
    }
  } catch(e) {
    btn.disabled=false;btn.textContent='GitHubに保存する';
    showToast('エラーが発生しました', false);
  }
}

function showToast(msg,ok){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(ok?'ok':'err');
  setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
