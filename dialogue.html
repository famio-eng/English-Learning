<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対話練習</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  --bg:#1a1a1a;--card:#242424;--card2:#2a2a2a;--border:#3a3a3a;
  --accent:#7c6ff7;--green:#22c55e;--amber:#f59e0b;--blue:#38bdf8;--red:#ef4444;
  --text:#f0f0f0;--text2:#aaaaaa;--text3:#666666;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:14px;min-height:100%}
a{color:inherit;text-decoration:none}
.container{max-width:540px;margin:0 auto;padding:0 14px 64px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.back-btn{color:var(--text2);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none}
.page-title{font-size:18px;font-weight:800}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.section{margin-bottom:12px}
.sec-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

/* Buttons */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-align:center;transition:opacity .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Script cards */
.script-card{background:var(--card2);border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s;margin-bottom:8px}
.script-card.selected{border-color:var(--accent);background:rgba(124,111,247,.08)}
.script-card-title{font-size:14px;font-weight:800}
.script-card-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* Count buttons */
.count-row{display:flex;gap:8px}
.count-btn{flex:1;padding:11px 0;border:2px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font-size:15px;font-weight:800;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.count-btn.selected{border-color:var(--accent);background:rgba(124,111,247,.12);color:var(--accent)}

/* Progress bar */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog-label{font-size:13px;font-weight:800;color:var(--text2);white-space:nowrap}
.prog-bar{flex:1;height:4px;background:var(--border);border-radius:2px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* Scene */
.scene-card{background:var(--card2);border-radius:14px;padding:20px 18px;text-align:center;margin-bottom:14px}
.scene-text{font-size:22px;font-weight:800;line-height:1.5}
.scene-hint{font-size:11px;color:var(--text3);margin-top:6px}
.target-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.target-chip{background:rgba(124,111,247,.1);border:1px solid rgba(124,111,247,.25);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--accent);font-weight:700}

/* Countdown ring */
.cd-wrap{display:flex;flex-direction:column;align-items:center;margin:10px 0 16px}
.cd-ring-wrap{position:relative;width:80px;height:80px}
.cd-ring-wrap svg{transform:rotate(-90deg)}
.cd-ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.cd-ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.cd-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800}
.cd-label{font-size:11px;font-weight:700;color:var(--text2);margin-top:6px}

/* Wave animation */
.wave-wrap{display:flex;align-items:center;justify-content:center;gap:4px;height:44px;margin:10px 0}
.wave-bar{width:4px;background:var(--accent);border-radius:2px;animation:wave .8s ease-in-out infinite}
.wave-bar:nth-child(1){animation-delay:0s}
.wave-bar:nth-child(2){animation-delay:.12s}
.wave-bar:nth-child(3){animation-delay:.24s}
.wave-bar:nth-child(4){animation-delay:.36s}
.wave-bar:nth-child(5){animation-delay:.24s}
.wave-bar:nth-child(6){animation-delay:.12s}
.wave-bar:nth-child(7){animation-delay:0s}
@keyframes wave{0%,100%{height:8px}50%{height:36px}}

/* CEFR */
.cefr-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:800}
.cefr-A1{background:rgba(170,170,170,.12);color:var(--text2)}
.cefr-A2{background:rgba(56,189,248,.12);color:var(--blue)}
.cefr-B1{background:rgba(245,158,11,.12);color:var(--amber)}
.cefr-B2{background:rgba(124,111,247,.12);color:var(--accent)}
.cefr-C1{background:rgba(34,197,94,.12);color:var(--green)}
.cefr-C2{background:rgba(239,68,68,.12);color:var(--red)}

/* Feedback */
.fb-stats{display:flex;gap:10px;margin-bottom:14px}
.fb-stat{flex:1;background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.fb-stat-val{font-size:20px;font-weight:800}
.fb-stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.fb-sec{margin-bottom:14px}
.fb-sec-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.fb-list{list-style:none}
.fb-list li{padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.5;display:flex;gap:6px}
.fb-list li:last-child{border:none}
.fb-list li::before{content:'•';color:var(--accent);flex-shrink:0}
.model-answer-box{background:rgba(124,111,247,.07);border:1px solid rgba(124,111,247,.18);border-radius:10px;padding:14px;font-size:14px;line-height:1.7;font-weight:700}

/* End screen */
.end-cefr-hero{text-align:center;padding:28px 0 20px}
.end-cefr-big{font-size:52px;font-weight:800}
.results-list{list-style:none}
.results-list li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.results-list li:last-child{border:none}
.result-scene{font-size:13px;color:var(--text2);flex:1;margin-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phrase-chips{display:flex;flex-wrap:wrap;gap:6px}
.phrase-chip{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700}

/* Graph */
.graph-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Question display */
.q-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.q-japanese{font-size:19px;font-weight:800;line-height:1.7;color:var(--text);text-align:left}
.q-hint{margin-top:12px;padding:10px 12px;background:rgba(124,111,247,.08);border:1px solid rgba(124,111,247,.2);border-radius:8px}

/* Loading */
.loading-center{text-align:center;padding:60px 16px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;pointer-events:none}

/* Pending badge */
.pending-badge{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.28);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--amber);text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="back-btn" onclick="goBack()">
      <i data-lucide="arrow-left" style="width:16px;height:16px"></i> 戻る
    </button>
    <div class="page-title">対話練習</div>
    <div style="width:60px"></div>
  </div>
  <div id="pendingBadge" class="pending-badge" style="display:none"></div>
  <div id="app"></div>
</div>
<script>
// ============================================================
// CONFIG
// ============================================================
var _p = new URLSearchParams(window.location.search);
var GEM_KEY  = _p.get('k')  || '';
var GH_TOKEN = _p.get('gh') || '';
var GH_OWNER = 'famio-eng';
var GH_REPO  = 'English-Learning';
var GH_BRANCH = 'main';
var GH_PROGRESS = 'data/progress.json';
var GEM_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

// ============================================================
// SCRIPTS
// ============================================================
var SCRIPTS = [
  {
    id: 'short',
    title: '自己紹介 ショート版（1分）',
    raw: "Hi, I'm Fami. I've been with the company for about ten years, but I'm relatively new to product development as a project manager—just two years into this role. I'm currently leading a project for an electrosurgical generator used in endoscopic surgery. We're at an exciting stage right now, about to submit applications for regulatory approval across multiple countries. I got my PMP certification earlier this year, so I'm looking forward to taking on more responsibility and driving projects forward. Happy to work with you all."
  },
  {
    id: 'casual',
    title: '自己紹介 カジュアル版（2分）',
    raw: "Thanks for having me. My name is Fami. I've been with the medical device company for ten years, but I want to be honest—my journey into product development is still relatively new. I spent most of my career in other areas, and this current project is actually my first real experience leading a major development initiative. It's been a challenging but rewarding two years.\n\nRight now, I'm managing a project for an electrosurgical generator—basically, it controls the power output of an electric scalpel used in minimally invasive endoscopic surgery. The technology is complex, and there's a lot to learn about regulatory pathways, but I'm genuinely excited about what we're building and where we're headed.\n\nWe're at a critical milestone. After two years of development, we're getting ready to move into regulatory submissions. That's no small feat in the medical device world, and I'm proud of what the team has accomplished so far. I recently earned my PMP certification, which has given me a much clearer framework for managing all the moving parts of this project.\n\nLooking forward to collaborating with all of you."
  },
  {
    id: 'formal',
    title: '自己紹介 フォーマル版（3〜4分）',
    raw: "Good morning, everyone. My name is Fami, and I'm the project manager for our electrosurgical generator development initiative.\n\nI'd like to give you a brief background on my journey here. I've been with the medical device company for approximately ten years. However, I want to be transparent: my direct experience in product development is more limited. For most of my tenure, I worked in other functions within the organization. This current project represents my first substantive leadership role in a full-scale medical device development program.\n\nWhat we're developing is an electrosurgical generator—a device that controls the power output of an electric surgical knife, or electroscalpel, used in endoscopic procedures. These are minimally invasive surgeries, which is why precision in power delivery is critical. The regulatory landscape for such devices is demanding, which has been an important learning curve for me.\n\nThe project itself is now in its second year. We've made significant progress through the development and clinical validation phases. As of now, we're preparing to move into regulatory submissions across multiple countries—a major milestone. This involves coordinating with various regulatory bodies, ensuring compliance with their specific requirements, and managing a complex timeline.\n\nTo strengthen my capabilities as a project manager, I completed my PMP certification earlier this year. That credential has given me a more rigorous framework for managing scope, schedule, cost, and stakeholder communication—all critical elements as we navigate the regulatory phase ahead.\n\nI'm committed to bringing both technical diligence and collaborative leadership to this team. I recognize that I'm still building my expertise in the medical device domain, but I'm also bringing a growth mindset and a willingness to learn from all of you. I look forward to working together."
  },
  {
    id: 'sop-status-report',
    title: 'SOP対応課題の状況報告',
    raw: "Recently, our project reached an important decision: to move forward with the European Declaration of Conformity process without waiting for full SOP compliance. This was supported by our confirmation that this project meets the exclusion criteria outlined in the SOP. Thank you all for your support in reaching this decision.\n\nAt the same time, Rob has recommended that we proceed in parallel with the SOP compliance work specifically related to risk management. We have already started working with the team to estimate the scope of that effort. We will share the results separately, and I'd like to discuss the details further when Rob visits Japan.\n\nRegarding the additional verification test with increased sample size, also recommended by Rob, we are currently preparing the test protocol with Rob's support.\n\nHowever, there is one concern I'd like to raise. According to our team members, if we proceed with the risk management-related SOP compliance, the approach to sample size may need to be reconsidered. This means we may need to incorporate the SOP requirements into the additional test protocol as well.\n\nFurthermore, since this SOP compliance work may result in changes to design documents, there is a possibility that we will need to go through the European Declaration of Conformity process once more in the future. However, our current thinking is that this could be addressed in the sustaining phase rather than within the current project timeline.\n\nThat covers the current status and key challenges. Please feel free to share any questions or comments."
  }
];

// ============================================================
// CEFR
// ============================================================
var CEFR_LEVELS = ['A1','A2','B1','B2','C1','C2'];
var CEFR_DESC = {
  A1:'単語レベルで何とか伝わる',
  A2:'簡単な文で意図は伝わる',
  B1:'多少の誤りはあるが自然に伝わる',
  B2:'ほぼ正確・自然な表現が使える',
  C1:'ネイティブに近い流暢さ',
  C2:'ネイティブレベル'
};

function cefrToNum(lv) { var i = CEFR_LEVELS.indexOf(lv); return i >= 0 ? i + 1 : 3; }
function numToCefr(n)  { return CEFR_LEVELS[Math.min(Math.max(Math.round(n), 1), 6) - 1]; }
function avgCefr(results) {
  var valid = results.filter(function(r) { return !r.pending; });
  if (!valid.length) return 'B1';
  var sum = valid.reduce(function(a, r) { return a + cefrToNum(r.cefrLevel || 'B1'); }, 0);
  return numToCefr(sum / valid.length);
}

// ============================================================
// SESSION STATE
// ============================================================
var S = {
  screen: 'start',    // start | loading | question | evaluating | feedback | end
  script: null,
  count: 5,
  questions: [],
  results: [],
  currentQ: 0,
  countdown: 3,
  cdIv: null,
  showHint: false,
  recStart: null,
  recording: false,
  mr: null,
  recMimeType: '',
  chunks: [],
  blob: null,
  pastSessions: [],
  pendingEvals: [],    // [{qIndex, b64, mimeType, reactionTime, q}] — deferred due to 503
  reEvalRunning: false
};

// ============================================================
// RENDER
// ============================================================
function render() {
  var app = document.getElementById('app');
  if (!app) return;
  var html = '';
  if      (S.screen === 'start')      html = buildStart();
  else if (S.screen === 'loading')    html = buildLoading('Geminiが問題を生成中...');
  else if (S.screen === 'question')   html = buildQuestion();
  else if (S.screen === 'evaluating') html = buildLoading('Geminiが評価中...');
  else if (S.screen === 'feedback')   html = buildFeedback();
  else if (S.screen === 'end')        html = buildEnd();
  app.innerHTML = html;
  if (typeof lucide !== 'undefined') lucide.createIcons();
  updatePendingBadge();
}

// ---- START ----
function buildStart() {
  var scriptCards = SCRIPTS.map(function(s) {
    var sel = S.script && S.script.id === s.id;
    return '<div class="script-card' + (sel ? ' selected' : '') + '" onclick="selScript(\'' + s.id + '\')">'
      + '<div class="script-card-title">' + escH(s.title) + '</div>'
      + '</div>';
  }).join('');

  var cntBtns = [3, 5, 10].map(function(n) {
    return '<button class="count-btn' + (S.count === n ? ' selected' : '') + '" onclick="selCount(' + n + ')">' + n + '問</button>';
  }).join('');

  return '<div class="section"><div class="sec-label">スクリプトを選択</div>' + scriptCards + '</div>'
    + '<div class="section" style="margin-top:16px"><div class="sec-label">問題数</div>'
    + '<div class="count-row">' + cntBtns + '</div></div>'
    + '<div style="margin-top:24px">'
    + '<button class="btn btn-primary" onclick="startSession()" ' + (!S.script ? 'disabled' : '') + '>練習開始</button>'
    + '</div>';
}

// ---- LOADING ----
function buildLoading(msg) {
  return '<div class="loading-center">'
    + '<div class="spinner"></div>'
    + '<div style="margin-top:14px;font-weight:700;color:var(--text2)">' + escH(msg) + '</div>'
    + '</div>';
}

// ---- QUESTION ----
function buildQuestion() {
  var q = S.questions[S.currentQ];
  if (!q) return '';
  var pct = (S.currentQ / S.questions.length * 100).toFixed(0);
  var avgBadge = S.results.length
    ? '<span class="cefr-badge cefr-' + avgCefr(S.results) + '">' + avgCefr(S.results) + '</span>'
    : '<span style="color:var(--text3);font-size:12px">-</span>';

  // Countdown ring
  var R = 30, C = 2 * Math.PI * R;
  var offset = C * (1 - S.countdown / 3);
  var cdHtml = S.countdown > 0
    ? '<div class="cd-wrap"><div class="cd-ring-wrap">'
      + '<svg width="80" height="80" viewBox="0 0 80 80">'
      + '<circle class="cd-ring-bg" cx="40" cy="40" r="' + R + '"/>'
      + '<circle class="cd-ring-fg" id="cdRing" cx="40" cy="40" r="' + R
      + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"/>'
      + '</svg>'
      + '<div class="cd-num" id="cdNum">' + S.countdown + '</div>'
      + '</div><div class="cd-label">準備...</div></div>'
    : '';

  // Hint area (shown inside scene card when activated)
  var hintHtml = '';
  if (S.showHint) {
    var chips = (q.targetPhrases || []).map(function(p) {
      return '<span class="target-chip">' + escH(p) + '</span>';
    }).join('');
    hintHtml = '<div class="q-hint">'
      + (chips ? '<div class="target-chips" style="justify-content:flex-start">' + chips + '</div>' : '')
      + (q.hint ? '<div style="font-size:12px;color:var(--text2);margin-top:6px">' + escH(q.hint) + '</div>' : '')
      + '</div>';
  }

  // Hint button: visible during countdown if not yet shown
  var hintBtnHtml = (!S.showHint && S.countdown > 0 && (q.targetPhrases || []).length)
    ? '<button class="btn btn-secondary" style="margin-bottom:10px;font-size:13px;padding:10px" onclick="S.showHint=true;render()">💡 ヒントを見る</button>'
    : '';

  // Action area
  var actionHtml = '';
  if (S.recording) {
    actionHtml = '<div class="wave-wrap">'
      + '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>'
      + '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>'
      + '<div class="wave-bar"></div></div>'
      + '<button class="btn btn-danger" onclick="stopRec()" style="margin-top:6px">⏹ 回答完了</button>';
  } else if (S.countdown <= 0) {
    actionHtml = '<button class="btn btn-primary" style="display:flex;align-items:center;justify-content:center;gap:8px" onclick="startRec()">'
      + '<i data-lucide="mic" style="width:18px;height:18px"></i> 🎙 録音して回答</button>';
  }

  return '<div class="prog-row">'
    + '<div class="prog-label">Q' + (S.currentQ + 1) + '/' + S.questions.length + '</div>'
    + '<div class="prog-bar"><div class="prog-fill" id="pFill" style="width:' + pct + '%"></div></div>'
    + avgBadge
    + '</div>'
    + '<div class="scene-card" style="text-align:left">'
    + '<div class="q-label">❓ 以下を英語で言ってください</div>'
    + '<div class="q-japanese">「' + escH(q.japanese || q.scene || '') + '」</div>'
    + hintHtml
    + '</div>'
    + hintBtnHtml
    + cdHtml
    + '<div style="margin-bottom:10px">' + actionHtml + '</div>'
    + '<button class="btn btn-secondary" onclick="skipQ()">スキップ</button>';
}

// ---- FEEDBACK ----
function buildFeedback() {
  var r = S.results[S.currentQ - 1];
  if (!r) return '';
  var q = S.questions[S.currentQ - 1] || {};
  var isLast = S.currentQ >= S.questions.length;
  var nextLabel = isLast ? 'セッション終了' : '次の問題 →';

  if (r.pending) {
    return '<div class="card section" style="text-align:center;padding:28px">'
      + '<div style="font-size:30px;margin-bottom:8px">⏳</div>'
      + '<div style="font-size:15px;font-weight:800;margin-bottom:8px;color:var(--amber)">評価保留中（503エラー）</div>'
      + '<div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px">'
      + 'Geminiサーバーが混雑しています。<br>セッション終了後に「保留分をまとめて評価」で<br>再評価できます。</div>'
      + '<div style="font-size:14px;font-weight:700">「' + escH(r.japanese || '') + '」</div>'
      + '</div>'
      + '<button class="btn btn-primary" style="margin-top:14px" onclick="nextQ()">' + nextLabel + '</button>';
  }

  if (r.skipped) {
    return '<div class="card section" style="text-align:center;padding:28px">'
      + '<div style="font-size:12px;color:var(--text3);margin-bottom:8px">スキップ</div>'
      + '<div style="font-size:18px;font-weight:800;margin-bottom:16px">「' + escH(r.japanese || r.scene || '') + '」</div>'
      + (r.modelAnswer ? '<div class="sec-label">模範回答</div><div class="model-answer-box">' + escH(r.modelAnswer) + '</div>' : '')
      + '</div>'
      + '<button class="btn btn-primary" style="margin-top:14px" onclick="nextQ()">' + nextLabel + '</button>';
  }

  var strengths = (r.strengths || []).map(function(s) { return '<li>' + escH(s) + '</li>'; }).join('');
  var improvements = (r.improvements || []).map(function(s) { return '<li>' + escH(s) + '</li>'; }).join('');

  return '<div class="fb-stats">'
    + '<div class="fb-stat"><div class="fb-stat-val"><span class="cefr-badge cefr-' + r.cefrLevel + '">' + r.cefrLevel + '</span></div>'
    + '<div class="fb-stat-lbl">' + (CEFR_DESC[r.cefrLevel] || '') + '</div></div>'
    + '<div class="fb-stat"><div class="fb-stat-val">' + r.reactionTime.toFixed(1) + '秒</div><div class="fb-stat-lbl">反応時間</div></div>'
    + '</div>'
    + '<div class="card section">'

function buildCefrGraph() {
  var sessions = S.pastSessions;
  if (sessions.length < 2) return '';
  var W = 300, H = 110, pL = 38, pR = 12, pT = 12, pB = 22;
  var iW = W - pL - pR, iH = H - pT - pB;
  var n = sessions.length;

  function xp(i) { return pL + (n > 1 ? i * iW / (n - 1) : iW / 2); }
  function yp(lv) { return pT + iH - ((cefrToNum(lv) - 1) / 5) * iH; }

  var gridLines = CEFR_LEVELS.map(function(lv) {
    var y = yp(lv);
    return '<line x1="' + pL + '" y1="' + y.toFixed(1) + '" x2="' + (W-pR) + '" y2="' + y.toFixed(1)
      + '" stroke="var(--border)" stroke-width="1"/>'
      + '<text x="' + (pL-4) + '" y="' + (y+4).toFixed(1) + '" fill="var(--text3)" font-size="9" text-anchor="end">' + lv + '</text>';
  }).join('');

  var pts = sessions.map(function(s, i) { return xp(i).toFixed(1) + ',' + yp(s.averageCefrLevel).toFixed(1); }).join(' ');
  var dots = sessions.map(function(s, i) {
    var isCur = i === n - 1;
    return '<circle cx="' + xp(i).toFixed(1) + '" cy="' + yp(s.averageCefrLevel).toFixed(1)
      + '" r="' + (isCur ? 6 : 4) + '" fill="var(--accent)"'
      + (isCur ? ' stroke="var(--bg)" stroke-width="2"' : ' opacity="0.7"') + '/>';
  }).join('');

  var dateLabels = '';
  if (n >= 1) {
    dateLabels += '<text x="' + xp(0).toFixed(1) + '" y="' + (H-4) + '" fill="var(--text3)" font-size="8" text-anchor="middle">' + (sessions[0].date||'').substring(5) + '</text>';
    dateLabels += '<text x="' + xp(n-1).toFixed(1) + '" y="' + (H-4) + '" fill="var(--text3)" font-size="8" text-anchor="middle">' + (sessions[n-1].date||'').substring(5) + '</text>';
  }

  return '<div class="card section"><div class="sec-label">CEFRレベル推移（過去10セッション）</div>'
    + '<div class="graph-scroll"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">'
    + gridLines
    + '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.5"/>'
    + dots + dateLabels
    + '</svg></div></div>';
}

function goBack() {
  if (S.screen === 'start') {
    window.location.href = './dashboard.html?k=' + encodeURIComponent(GEM_KEY) + '&gh=' + encodeURIComponent(GH_TOKEN);
    return;
  }
  if (S.screen === 'end') { S.screen = 'start'; render(); return; }
  if (confirm('練習を中断しますか？')) {
    stopAll();
    S.screen = 'start';
    render();
  }
}

function selScript(id) {
  S.script = SCRIPTS.filter(function(s) { return s.id === id; })[0] || null;
  render();
}

function selCount(n) { S.count = n; render(); }

function stopAll() {
  if (S.cdIv) { clearInterval(S.cdIv); S.cdIv = null; }
  if (S.mr && S.recording) { try { S.mr.stop(); } catch(e) {} }
  S.recording = false;
}

async function startSession() {
  if (!S.script) return;
  if (!GEM_KEY) { showToast('⚠️ GeminiキーがURLにありません (?k=)'); return; }
  S.results = [];
  S.currentQ = 0;
  S.showHint = false;
  S.screen = 'loading';
  render();

  await loadPastSessions();
  var weakPhrases = extractWeak();
  var qs;
  var apiErrMsg = null;
  try {
    qs = await generateQuestions(S.script, S.count, weakPhrases);
  } catch(e) {
    apiErrMsg = e.message || '不明なエラー';
  }
  if (!qs || !qs.length) {
    qs = makeFallbackQuestions(S.script, S.count);
    if (apiErrMsg) {
      showToast('問題生成失敗: ' + apiErrMsg + ' | オフライン問題で開始します');
    } else {
      showToast('API応答が空のためオフライン問題を使用します');
    }
  }
  if (!qs || !qs.length) {
    showToast('問題の生成に失敗しました');
    S.screen = 'start';
    render();
    return;
  }
  S.questions = qs;
  S.currentQ = 0;
  S.countdown = 3;
  S.screen = 'question';
  render();
  startCountdown();
}

function startCountdown() {
  if (S.cdIv) clearInterval(S.cdIv);
  S.cdIv = setInterval(function() {
    S.countdown--;
    if (S.countdown <= 0) {
      clearInterval(S.cdIv); S.cdIv = null;
      S.countdown = 0;
      render();
      startRec();
    } else {
      var numEl = document.getElementById('cdNum');
      var ringEl = document.getElementById('cdRing');
      if (numEl) numEl.textContent = S.countdown;
      if (ringEl) {
        var C = 2 * Math.PI * 30;
        ringEl.setAttribute('stroke-dashoffset', (C * (1 - S.countdown / 3)).toFixed(2));
      }
    }
  }, 1000);
}

function startRec() {
  if (S.recording) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    var mt = '';
    for (var i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported(types[i])) { mt = types[i]; break; }
    }
    S.mr = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream);
    S.recMimeType = mt || (S.mr.mimeType || 'audio/webm');
    S.chunks = [];
    S.recStart = Date.now();
    S.recording = true;
    S.mr.ondataavailable = function(e) { if (e.data && e.data.size > 0) S.chunks.push(e.data); };
    S.mr.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      var reactionTime = (Date.now() - S.recStart) / 1000;
      S.blob = new Blob(S.chunks, { type: S.recMimeType });
      S.recording = false;
      doEval(reactionTime);
    };
    S.mr.start(100);
    render();
  }).catch(function() {
    showToast('マイクへのアクセスが拒否されました');
    S.recording = false;
    render();
  });
}

function stopRec() {
  if (S.mr && S.recording) {
    try { if (S.mr.state === 'recording') S.mr.requestData(); } catch(e) {}
    S.mr.stop();
  }
}

async function skipQ() {
  if (S.cdIv) { clearInterval(S.cdIv); S.cdIv = null; }
  stopAll();
  var q = S.questions[S.currentQ];
  S.screen = 'evaluating';
  render();
  var answer = await getModelAnswer(q);
  S.results.push({
    q: S.currentQ + 1,
    japanese: q ? (q.japanese || q.scene || '') : '',
    cefrLevel: 'A1',
    score: 0,
    reactionTime: 0,
    strengths: [],
    improvements: ['スキップされました。次回は英語で話してみましょう'],
    modelAnswer: answer,
    skipped: true
  });
  S.currentQ++;
  S.screen = 'feedback';
  render();
}

async function doEval(reactionTime) {
  S.screen = 'evaluating';
  render();
  var q = S.questions[S.currentQ];
  var ev;
  try {
    ev = await evalAnswer(S.blob, q, reactionTime);
  } catch(e) {
    if (e.message === 'GEMINI_503' && S.pendingEvals.length < 5) {
      var b64 = await blobToB64(S.blob).catch(function() { return null; });
      if (b64) {
        S.pendingEvals.push({
          qIndex: S.currentQ,
          b64: b64,
          mimeType: S.recMimeType || (S.blob && S.blob.type) || 'audio/webm',
          reactionTime: reactionTime,
          q: q
        });
        S.results.push({
          q: S.currentQ + 1,
          japanese: q ? (q.japanese || q.scene || '') : '',
          cefrLevel: 'B1', score: null, reactionTime: reactionTime,
          strengths: [], improvements: [], modelAnswer: '', pending: true
        });
        showToast('503エラー: 評価を保留しました（' + S.pendingEvals.length + '問）');
        S.currentQ++;
        S.screen = 'feedback';
        render();
        return;
      }
    }
    var hs2 = e.httpStatus || 0;
    var userMsg2;
    if (hs2 === 429) userMsg2 = 'レート制限に達しました。1分後に再試行してください。';
    else if (hs2 === 400) userMsg2 = '音声データの形式に問題があります。録音し直してください。';
    else if (hs2 === 401 || hs2 === 403) userMsg2 = 'APIキーが無効です。URLを確認してください。';
    else if (hs2 > 0) userMsg2 = 'エラーが発生しました。（HTTP ' + hs2 + ' ' + (e.apiCode || '') + '）';
    else userMsg2 = 'エラーが発生しました。（' + (e.message || '不明') + '）';
    console.error('[doEval エラー] HTTP:', hs2, 'Code:', e.apiCode, 'Msg:', e.apiMessage || e.message);
    ev = { cefrLevel: 'A1', score: 0, improvements: [userMsg2], _evalError: userMsg2 };
  }
  if (ev._evalError) {
    showToast('評価失敗: ' + ev._evalError);
    delete ev._evalError;
  }
  S.results.push(Object.assign({ q: S.currentQ + 1, japanese: q ? (q.japanese || q.scene || '') : '', reactionTime: reactionTime }, ev));
  S.currentQ++;
  S.screen = 'feedback';
  render();
}

function nextQ() {
  S.showHint = false;
  if (S.currentQ >= S.questions.length) {
    finishSession();
  } else {
    S.countdown = 3;
    S.screen = 'question';
    render();
    startCountdown();
  }
}

function finishSession() {
  var curSess = { date: new Date().toISOString().split('T')[0], averageCefrLevel: avgCefr(S.results) };
  S.pastSessions.push(curSess);
  S.screen = 'end';
  render();
  markDailyTask();
}

function retrySession() {
  S.results = []; S.questions = []; S.currentQ = 0;
  S.screen = 'start';
  render();
}

// ============================================================
// GEMINI
// ============================================================
async function callGeminiWithFallback(payload) {
  var models = [
    'gemini-2.5-flash',
    'gemini-2.5-flash-lite',
    'gemini-3.5-flash'
  ];
  var baseUrl = 'https://generativelanguage.googleapis.com/v1beta/models/';
  for (var i = 0; i < models.length; i++) {
    var url = baseUrl + models[i] + ':generateContent?key=' + GEM_KEY;
    try {
      var res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      var shouldFallback = res.status === 429 || res.status === 503 || res.status === 404;
      if (data.error) {
        var errCode = data.error.code;
        var errMsg = (data.error.message || '').toLowerCase();
        if (errCode === 429 || errCode === 503 || errCode === 404 ||
            errMsg.indexOf('quota') >= 0 || errMsg.indexOf('resource_exhausted') >= 0 ||
            errMsg.indexOf('unavailable') >= 0 || errMsg.indexOf('overloaded') >= 0 ||
            errMsg.indexOf('not found') >= 0 || errMsg.indexOf('not supported') >= 0 ||
            errMsg.indexOf('deprecated') >= 0) shouldFallback = true;
      }
      if (shouldFallback) {
        console.log(models[i] + ' unavailable, trying: ' + (models[i + 1] || 'no more models'));
        continue;
      }
      console.log('[Dialogue] Gemini success with model: ' + models[i]);
      return {data: data, model: models[i], status: res.status};
    } catch(e) {
      console.log(models[i] + ' error: ' + e.message);
      if (i === models.length - 1) throw e;
      continue;
    }
  }
  throw new Error('全モデルがレート制限に達しました。しばらく待ってから再試行してください。');
}

function callGemini(parts) {
  if (!GEM_KEY) return Promise.resolve(null);
  var payload = { contents: [{ parts: parts }], generationConfig: { temperature: 0.3, maxOutputTokens: 4096 } };
  return callGeminiWithFallback(payload).then(function(result) {
    var _httpStatus = result.status;
    console.log('[Dialogue] Gemini model used:', result.model);
    if (_httpStatus === 503) throw new Error('GEMINI_503');
    var d = result.data;
    if (d.error) {
      var apiCode = d.error.status || String(d.error.code || _httpStatus);
      var apiMsg  = (d.error.message || '').split('\n')[0].substring(0, 120);
      var err = new Error('HTTP_' + _httpStatus);
      err.httpStatus = _httpStatus;
      err.apiCode = apiCode;
      err.apiMessage = apiMsg;
      throw err;
    }
    if (!d.candidates || !d.candidates[0]) return null;
    return (d.candidates[0].content.parts || []).map(function(p) { return p.text || ''; }).join('');
  });
}

async function generateQuestions(script, count, weakPhrases) {
  var weakStr = weakPhrases.length
    ? '\n苦手フレーズ（優先出題）: ' + weakPhrases.slice(0, 5).join(', ')
    : '';
  var prompt = '以下のスクリプトから瞬間英作文の練習問題を' + count + '問生成してください。\n'
    + '各問題は「日本語の文章を英語で言う」形式です。\n\n'
    + 'スクリプト: ' + script.raw
    + weakStr
    + '\n\n以下のJSON配列のみを返してください：\n'
    + '[{"japanese":"瞬時に英語で言ってほしい日本語の文章","targetPhrases":["使ってほしい英語フレーズ1","フレーズ2"],"hint":"難しい単語のヒント（任意）"}]\n\n'
    + '条件:\n- 1問は1〜2文程度の長さ\n- スクリプトの重要フレーズを含む問題を優先\n- 簡単な問題から徐々に難しくなるよう順番を調整';
  var res = await callGemini([{ text: prompt }]);
  try {
    if (!res) return null;
    var cleaned = res.replace(/```(?:json)?\n?/gi, '').replace(/\n?```/g, '').trim();
    var m = cleaned.match(/\[[\s\S]*\]/);  // greedy: capture full array including nested []
    if (!m) return null;
    var arr = JSON.parse(m[0]);
    return Array.isArray(arr) && arr.length ? arr : null;
  } catch(e) { return null; }
}

function makeFallbackQuestions(script, count) {
  var sents = [];
  script.raw.replace(/\n+/g, ' ').replace(/([^.!?]{10,}[.!?])\s*/g, function(_, s) {
    s = s.trim().replace(/[.!?]+$/, '');
    if (s.length >= 15 && s.length <= 250) sents.push(s);
  });
  if (!sents.length) return null;
  var result = [];
  for (var i = 0; i < count; i++) {
    var idx = Math.min(Math.round(i * sents.length / count), sents.length - 1);
    var s = sents[idx];
    var words = s.split(' ');
    var ph1 = words.slice(0, 5).join(' ');
    var ph2 = words.slice(Math.floor(words.length / 2), Math.floor(words.length / 2) + 4).join(' ');
    result.push({
      japanese: 'スクリプト第' + (i + 1) + '文を英語で言ってください（ヒント: 「' + s.substring(0, 20) + '…」）',
      targetPhrases: [ph1, ph2].filter(function(p) { return p && p.trim().length > 3; }).slice(0, 2),
      hint: s  // full English sentence shown as hint
    });
  }
  return result;
}

async function evalAnswer(audioBlob, q, reactionTime) {
  var fallback = { cefrLevel: 'B1', score: 50, strengths: [], improvements: ['評価に失敗しました'], modelAnswer: '', fillerCount: 0 };
  if (!audioBlob || audioBlob.size < 100) {
    return Object.assign({}, fallback, { cefrLevel: 'A1', score: 0, improvements: ['音声が録音されませんでした'] });
  }
  var base64 = await blobToB64(audioBlob);
  var mt = S.recMimeType || audioBlob.type || 'audio/mp4';
  var sizeKb = Math.round(audioBlob.size / 1024);
  console.log('[AI評価] mime_type:', mt, '| size:', sizeKb + 'KB');
  var scriptExcerpt = S.script ? S.script.raw.replace(/\n+/g, ' ').substring(0, 200) : '';
  var prompt = 'You are an English coach evaluating a business English speaking practice.\n'
    + 'Scene: ' + (q ? (q.japanese || q.scene || '') : '') + '\n'
    + 'Target phrases: ' + ((q && q.targetPhrases) ? q.targetPhrases.join(', ') : '') + '\n'
    + 'Reference script: ' + scriptExcerpt + '\n\n'
    + 'Return ONLY this JSON, no markdown:\n'
    + '{"cefrLevel":"B1","cefrDescription":"多少の誤りはあるが自然に伝わる","score":70,'
    + '"strengths":["良かった点を日本語で"],'
    + '"improvements":["改善点を日本語で"],'
    + '"modelAnswer":"模範回答の英語","fillerCount":0}';
  try {
    var res = await callGemini([{ text: prompt }, { inline_data: { mime_type: mt, data: base64 } }]);
    if (!res) return Object.assign({}, fallback, { improvements: ['APIからの応答が空でした'] });
    var cleaned = res.replace(/```(?:json)?\n?/gi, '').replace(/\n?```/g, '').trim();
    var m = cleaned.match(/\{[\s\S]*\}/);
    if (!m) return Object.assign({}, fallback, { improvements: ['JSONの解析に失敗しました'] });
    var obj = JSON.parse(m[0]);
    if (!CEFR_DESC[obj.cefrLevel]) obj.cefrLevel = 'B1';
    return obj;
  } catch(e) {
    if (e.message === 'GEMINI_503') throw e;
    var hs = e.httpStatus || 0;
    var userMsg;
    if (hs === 429) userMsg = 'レート制限に達しました。1分後に再試行してください。';
    else if (hs === 400) userMsg = '音声データの形式に問題があります。録音し直してください。';
    else if (hs === 401 || hs === 403) userMsg = 'APIキーが無効です。URLを確認してください。';
    else if (hs > 0) userMsg = 'エラーが発生しました。（HTTP ' + hs + ' ' + (e.apiCode || '') + '）';
    else userMsg = 'エラーが発生しました。（' + (e.message || '不明') + '）';
    var detail = 'エラー詳細:\n HTTP: ' + (hs || '-')
      + '\n Code: ' + (e.apiCode || '-')
      + '\n Message: ' + (e.apiMessage || e.message || '不明').substring(0, 150)
      + '\n 音声形式: ' + mt
      + '\n 録音サイズ: ' + sizeKb + 'KB';
    console.error('[AI評価エラー]\n' + detail);
    return Object.assign({}, fallback, {
      cefrLevel: 'A1', score: 0,
      improvements: [userMsg],
      _evalError: userMsg
    });
  }
}

async function getModelAnswer(q) {
  if (!GEM_KEY || !q) return '';
  var jp = q.japanese || q.scene || '';
  var prompt = 'Translate this Japanese sentence to natural business English (1-2 sentences):\n「' + jp + '」\nReturn the English text only, no explanation.'
    + (q.targetPhrases && q.targetPhrases.length ? '\nTry to use: ' + q.targetPhrases.join(', ') : '');
  try {
    return await callGemini([{ text: prompt }]) || '';
  } catch(e) { return ''; }
}

// ============================================================
// GITHUB
// ============================================================
function decB64(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); }
function encB64(s) { return btoa(unescape(encodeURIComponent(s))); }

function ghGet(path) {
  return fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path, {
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
  }).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
}

function ghPut(path, content, message) {
  return fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, content: content, branch: GH_BRANCH })
  }).then(function(r) { return r.json(); }).catch(function() { return null; });
}

async function loadPastSessions() {
  S.pastSessions = [];
  if (!GH_TOKEN) return;
  try {
    var files = await ghGet('records?ref=' + GH_BRANCH);
    if (!Array.isArray(files)) return;
    var dFiles = files
      .filter(function(f) { return f.name.endsWith('-dialogue.json'); })
      .sort(function(a, b) { return b.name.localeCompare(a.name); })
      .slice(0, 9);
    var loaded = await Promise.all(dFiles.map(function(f) {
      var url = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/records/' + f.name;
      return fetch(url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
    }));
    S.pastSessions = loaded.filter(Boolean).reverse();
  } catch(e) {}
}

function extractWeak() {
  var phrs = {};
  S.pastSessions.forEach(function(s) {
    (s.keyPhrases || []).forEach(function(p) { phrs[p] = true; });
  });
  return Object.keys(phrs).slice(0, 5);
}

async function saveSession() {
  if (!GH_TOKEN) return;
  var btn = document.getElementById('saveBtn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }

  var now = new Date();
  var d = now.toISOString().split('T')[0];
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var fname = d + '-' + h + '-' + m + '-dialogue.json';

  var weakSet = {};
  S.results.forEach(function(r) {
    (r.improvements || []).forEach(function(imp) {
      var mt = imp.match(/["「]([^"」]{2,25})["」]/g);
      if (mt) mt.forEach(function(p) { weakSet[p.replace(/["「」"]/g,'')] = true; });
    });
  });

  var record = {
    date: d, time: h + ':' + m, type: 'dialogue',
    scriptId: S.script ? S.script.id : '',
    scriptTitle: S.script ? S.script.title : '',
    questions: S.questions.length,
    averageCefrLevel: avgCefr(S.results),
    results: S.results.map(function(r, i) {
      return { q: i+1, japanese: r.japanese || '', cefrLevel: r.cefrLevel, score: r.score||0,
               reactionTime: r.reactionTime, strengths: r.strengths||[],
               improvements: r.improvements||[], modelAnswer: r.modelAnswer||'' };
    }),
    keyPhrases: Object.keys(weakSet).slice(0, 6),
    nextAction: S.results.length ? ((S.results[S.results.length-1].improvements||[])[0]||'') : ''
  };

  var res = await ghPut('records/' + fname, encB64(JSON.stringify(record, null, 2)), 'Add dialogue: ' + fname);
  if (res && res.content) {
    showToast('✓ 保存しました');
    if (btn) btn.textContent = '✓ 保存済み';
  } else {
    showToast('保存に失敗しました');
    if (btn) { btn.disabled = false; btn.textContent = '💾 GitHubに保存'; }
  }
}

function markDailyTask() {
  if (!GH_TOKEN) return;
  var today = new Date().toISOString().split('T')[0];
  var url = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PROGRESS;
  fetch(url, { headers: { 'Authorization': 'Bearer ' + GH_TOKEN } })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d || !d.content) return;
      var obj;
      try { obj = JSON.parse(decB64(d.content)); } catch(e) { obj = {}; }
      if (!obj.dailyTasks) obj.dailyTasks = {};
      if (!obj.dailyTasks[today]) obj.dailyTasks[today] = {};
      if (obj.dailyTasks[today].dialogue) return;
      obj.dailyTasks[today].dialogue = true;
      return fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Update: dialogue done ' + today, content: encB64(JSON.stringify(obj, null, 2)), sha: d.sha, branch: GH_BRANCH })
      });
    }).catch(function() {});
}

// ============================================================
// UTILS
// ============================================================
function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function blobToB64(blob) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onloadend = function() { resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2800);
}

// ============================================================
// PENDING EVALUATION
// ============================================================
function updatePendingBadge() {
  var el = document.getElementById('pendingBadge');
  if (!el) return;
  if (S.pendingEvals.length > 0) {
    el.style.display = 'block';
    el.textContent = '⏳ 未評価: ' + S.pendingEvals.length + '問 — セッション終了後にまとめて再評価できます';
  } else {
    el.style.display = 'none';
  }
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

async function evalAnswerFromB64(b64, mimeType, q) {
  var fallback = { cefrLevel: 'B1', score: 50, strengths: [], improvements: ['評価に失敗しました'], modelAnswer: '', fillerCount: 0 };
  if (!b64) return Object.assign({}, fallback, { improvements: ['音声データが見つかりません'] });
  var scriptExcerpt = S.script ? S.script.raw.replace(/\n+/g, ' ').substring(0, 200) : '';
  var prompt = 'You are an English coach evaluating a business English speaking practice.\n'
    + 'Scene: ' + (q ? (q.japanese || q.scene || '') : '') + '\n'
    + 'Target phrases: ' + ((q && q.targetPhrases) ? q.targetPhrases.join(', ') : '') + '\n'
    + 'Reference script: ' + scriptExcerpt + '\n\n'
    + 'Return ONLY this JSON, no markdown:\n'
    + '{"cefrLevel":"B1","cefrDescription":"多少の誤りはあるが自然に伝わる","score":70,'
    + '"strengths":["良かった点を日本語で"],'
    + '"improvements":["改善点を日本語で"],'
    + '"modelAnswer":"模範回答の英語","fillerCount":0}';
  var res = await callGemini([{ text: prompt }, { inline_data: { mime_type: mimeType, data: b64 } }]);
  if (!res) return Object.assign({}, fallback, { improvements: ['APIからの応答が空でした'] });
  var cleaned = res.replace(/```(?:json)?\n?/gi, '').replace(/\n?```/g, '').trim();
  var m = cleaned.match(/\{[\s\S]*\}/);
  if (!m) return Object.assign({}, fallback, { improvements: ['JSONの解析に失敗しました'] });
  var obj = JSON.parse(m[0]);
  if (!CEFR_DESC[obj.cefrLevel]) obj.cefrLevel = 'B1';
  return obj;
}

async function startReEval() {
  if (S.reEvalRunning || !S.pendingEvals.length) return;
  S.reEvalRunning = true;
  var total = S.pendingEvals.length;
  var done = 0;

  for (var i = 0; i < total; i++) {
    var btn = document.getElementById('reEvalBtn');
    if (btn) btn.textContent = '評価中... ' + done + '/' + total + '問完了';

    var pending = S.pendingEvals[i];
    var ev = null;
    var tried503 = false;

    while (!ev) {
      try {
        ev = await evalAnswerFromB64(pending.b64, pending.mimeType, pending.q);
      } catch(e) {
        if (e.message === 'GEMINI_503' && !tried503) {
          tried503 = true;
          var retryBtn = document.getElementById('reEvalBtn');
          if (retryBtn) retryBtn.textContent = '503エラー — 30秒後に再試行...';
          await sleep(30000);
        } else {
          ev = { cefrLevel: 'B1', score: 0, strengths: [], improvements: ['再評価失敗: ' + (e.message || '不明')], modelAnswer: '' };
        }
      }
    }

    // Update matching pending result in S.results
    for (var j = 0; j < S.results.length; j++) {
      if (S.results[j].q === pending.qIndex + 1 && S.results[j].pending) {
        Object.assign(S.results[j], ev, { pending: false, reactionTime: pending.reactionTime });
        break;
      }
    }

    done++;
    if (i < total - 1) {
      var waitBtn = document.getElementById('reEvalBtn');
      if (waitBtn) waitBtn.textContent = '評価中... ' + done + '/' + total + '問完了（次まで5秒待機）';
      await sleep(5000);
    }
  }

  S.pendingEvals = [];
  S.reEvalRunning = false;
  render();
  showToast('✓ 再評価が完了しました（' + total + '問）');
}

window.addEventListener('beforeunload', function(e) {
  if (S.pendingEvals.length > 0) {
    var msg = '未評価の録音が ' + S.pendingEvals.length + ' 問あります。閉じると評価できなくなります';
    e.returnValue = msg;
    return msg;
  }
});

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() { render(); });
</script>
